<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>채움로그 - 레이아웃 골격 테스트</title>

<style>
  :root {
    --bg: #EFF5EC;
    --paper: #F7FAF6;
    --card: #FDFEFC;
    --ink: #2B332E;
    --sage: #8FB89E;
    --lime: #C4D6A4;
    --line: #DDE6DC;
    --muted: #a3b5a8;
    --sub-ink: #6b8074;
    --font-sans: 'Pretendard', -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  /* html/body는 일반 문서 흐름. 뷰포트 자체를 스크롤 못하게만 막는다. */
  html, body {
    width:100%;
    height:100%;
    overflow:hidden;
    background:#ff00ff; /* 진단용: body 배경을 마젠타로 - 이 색이 보이면 body가 #app보다 큰 것 */
    font-family:var(--font-sans);
    color:var(--ink);
  }

  /* #app: position:fixed로 뷰포트 4방향에 직접 고정. body는 fixed 아님(이중 fixed 방지) */
  #app {
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    background:var(--bg);
  }

  /* ===== TOPBAR: 고정, flex-shrink:0 ===== */
  #app-topbar {
    flex-shrink:0;
    background:var(--card);
    border-bottom:1px solid var(--line);
  }

  #topbar-main {
    padding:calc(env(safe-area-inset-top) + 14px) 20px 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }

  #topbar-main .logo {
    font-family:var(--font-mono);
    font-size:13px;
    letter-spacing:1px;
    color:var(--sage);
    font-weight:600;
  }

  #topbar-main .date {
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--muted);
  }

  /* 서브줄: 화면별 뒤로가기 등. 내용 없으면 자동으로 숨김(공간 차지 X) */
  #topbar-sub {
    display:none;
    align-items:center;
    gap:6px;
    padding:0 20px 12px;
    font-size:14px;
    color:var(--ink);
    font-weight:600;
  }

  #topbar-sub.show { display:flex; }

  #topbar-sub .back-btn {
    display:flex;
    align-items:center;
    justify-content:center;
    width:28px; height:28px;
    margin-left:-6px;
    border:none;
    background:none;
    color:var(--sub-ink);
    font-size:18px;
    cursor:pointer;
  }

  /* ===== SCROLL: 남는 공간 전부, 스크롤은 여기서만 ===== */
  #app-scroll {
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:20px;
  }

  #app-scroll .block {
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px;
    margin-bottom:14px;
    font-size:14px;
    line-height:1.6;
    color:var(--sub-ink);
  }

  /* ===== TABBAR: 고정, flex-shrink:0, 화면 최하단 ===== */
  #app-tabbar {
    flex-shrink:0;
    display:flex;
    background:var(--card);
    border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
  }

  #app-tabbar button {
    flex:1;
    border:none;
    background:none;
    font-family:inherit;
    padding:12px 4px;
    font-size:12px;
    color:var(--muted);
  }

  #app-tabbar button.active {
    color:var(--sage);
    font-weight:600;
  }

  /* 화면 최하단 확인용 마커 - 검증 끝나면 제거 */
  .debug-marker {
    position:fixed;
    left:0; right:0; bottom:0;
    height:2px;
    background:red;
    z-index:999;
    pointer-events:none;
  }

  /* ===== 화면 전환 (최소 골격) ===== */
  .screen { display:none; }
  .screen.active { display:block; }

  .empty-state {
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
    font-size:14px;
  }
</style>
</head>
<body>

<div id="app">

  <div id="app-topbar">
    <div id="topbar-main">
      <span class="logo">채움로그</span>
      <span class="date" id="topbar-date"></span>
    </div>
    <div id="topbar-sub">
      <button class="back-btn" onclick="goHome()"><i class="ti ti-chevron-left"></i></button>
      <span id="topbar-sub-title"></span>
    </div>
  </div>

  <div id="app-scroll">

    <div class="screen active" id="screen-home">
      <div class="block">홈 화면 · 오늘의 기록 카드 영역</div>
      <div class="block">아카이브 요약 그리드 영역</div>
      <div class="block">통계 영역</div>
      <div class="block" onclick="goScreen('archive-detail','카테고리 상세')" style="cursor:pointer;">
        탭하면 서브줄(뒤로가기) 있는 상세화면으로 이동 →
      </div>
    </div>

    <div class="screen" id="screen-archive">
      <div class="empty-state">아카이브 목록 자리</div>
    </div>

    <div class="screen" id="screen-archive-detail">
      <div class="block">여기는 서브줄(뒤로가기)이 있는 화면입니다.</div>
      <div class="block">스크롤 테스트용 블록</div>
      <div class="block">스크롤 테스트용 블록</div>
      <div class="block">스크롤 테스트용 블록</div>
      <div class="block">스크롤 테스트용 블록</div>
      <div class="block">여기까지 스크롤되어도 탭바가 화면 맨 아래 고정되어야 합니다.</div>
    </div>

    <div class="screen" id="screen-search">
      <div class="empty-state">검색 자리</div>
    </div>

    <div class="screen" id="screen-mypage">
      <div class="empty-state">마이페이지 자리</div>
    </div>

  </div>

  <div id="app-tabbar">
    <button class="tab-btn active" data-tab="home" onclick="goScreen('home')">홈</button>
    <button class="tab-btn" data-tab="archive" onclick="goScreen('archive')">아카이브</button>
    <button class="tab-btn" data-tab="search" onclick="goScreen('search')">검색</button>
    <button class="tab-btn" data-tab="mypage" onclick="goScreen('mypage')">마이페이지</button>
  </div>

</div>

<!-- 빨간 선이 항상 화면 맨 아래 붙어있어야 정상. 탭바 아래 여백 있으면 이 선과 탭바 사이에 틈이 보임 -->
<div class="debug-marker"></div>

<div id="debug-info" style="position:fixed; top:50%; left:0; right:0; z-index:1000; background:rgba(0,0,0,0.8); color:#fff; font-size:11px; padding:8px; text-align:center; font-family:monospace; pointer-events:none;"></div>

<script>
  // 실시간 좌표 확인용 (콘솔에서 확인)
  function logRects() {
    const app = document.getElementById('app');
    const tabbar = document.getElementById('app-tabbar');
    const scrollEl = document.getElementById('app-scroll');
    const appRect = app.getBoundingClientRect();
    const tabRect = tabbar.getBoundingClientRect();
    const info = document.getElementById('debug-info');
    info.innerHTML =
      `window.innerHeight: ${window.innerHeight}<br>` +
      `visualViewport.height: ${window.visualViewport ? window.visualViewport.height : 'N/A'}<br>` +
      `body.clientHeight: ${document.body.clientHeight}<br>` +
      `#app height: ${appRect.height.toFixed(1)} (bottom:${appRect.bottom.toFixed(1)})<br>` +
      `#app-scroll scrollHeight:${scrollEl.scrollHeight} clientHeight:${scrollEl.clientHeight}<br>` +
      `tabbar bottom: ${tabRect.bottom.toFixed(1)}`;
  }
  window.addEventListener('load', logRects);
  window.addEventListener('resize', logRects);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', logRects);
  setTimeout(logRects, 500);
  setTimeout(logRects, 1500);

  // ===== 화면 전환 (최소 골격) =====
  const TAB_SCREENS = ['home', 'archive', 'search', 'mypage']; // 탭바에 직접 대응되는 화면
  const SUB_TITLES = { 'archive-detail': '카테고리 상세' };

  function goScreen(name, subTitle) {
    document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
    document.getElementById('screen-' + name).classList.add('active');
    document.getElementById('app-scroll').scrollTop = 0;

    // 탭바 active 표시: 탭에 직접 속하지 않는 화면(예: archive-detail)은 상위 탭 유지
    const tabName = TAB_SCREENS.includes(name) ? name : name.split('-')[0];
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tab === tabName);
    });

    // topbar 서브줄: 탭바에 없는 화면(상세 화면)이면 뒤로가기 서브줄 노출
    const subBar = document.getElementById('topbar-sub');
    if (!TAB_SCREENS.includes(name)) {
      document.getElementById('topbar-sub-title').textContent = subTitle || SUB_TITLES[name] || '';
      subBar.classList.add('show');
    } else {
      subBar.classList.remove('show');
    }
  }

  function goHome() {
    goScreen('home');
  }

  // 상단 날짜 표시
  function renderDate() {
    const d = new Date();
    const days = ['일','월','화','수','목','금','토'];
    document.getElementById('topbar-date').textContent =
      `${d.getMonth() + 1}.${d.getDate()} (${days[d.getDay()]})`;
  }
  renderDate();
</script>

</body>
</html>

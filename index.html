<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>채움로그 - 레이아웃 골격 테스트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">

<style>
  :root {
    --bg: #EFF5EC;
    --paper: #F7FAF6;
    --card: #FDFEFC;
    --ink: #2B332E;
    --sage: #8FB89E;
    --lime: #C4D6A4;
    --line: #DDE6DC;
    --muted: #a3b5a8;
    --sub-ink: #6b8074;
    --font-sans: 'Pretendard', -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  /* html/body는 일반 문서 흐름. 뷰포트 자체를 스크롤 못하게만 막는다. */
  html, body {
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg);
    font-family:var(--font-sans);
    color:var(--ink);
  }

  /* #app: position:fixed로 뷰포트 4방향에 직접 고정. body는 fixed 아님(이중 fixed 방지) */
  #app {
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    background:var(--bg);
  }

  /* ===== TOPBAR: 고정, flex-shrink:0 ===== */
  #app-topbar {
    flex-shrink:0;
    background:var(--card);
    border-bottom:1px solid var(--line);
  }

  #topbar-main {
    padding:calc(env(safe-area-inset-top) + 14px) 20px 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }

  #topbar-main .logo {
    font-family:var(--font-mono);
    font-size:13px;
    letter-spacing:1px;
    color:var(--sage);
    font-weight:600;
  }

  #topbar-main .date {
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--muted);
  }

  /* 서브줄: 화면별 뒤로가기 등. 내용 없으면 자동으로 숨김(공간 차지 X) */
  #topbar-sub {
    display:none;
    align-items:center;
    gap:6px;
    padding:0 20px 12px;
    font-size:14px;
    color:var(--ink);
    font-weight:600;
  }

  #topbar-sub.show { display:flex; }

  #topbar-sub .back-btn {
    display:flex;
    align-items:center;
    justify-content:center;
    width:28px; height:28px;
    margin-left:-6px;
    border:none;
    background:none;
    color:var(--sub-ink);
    font-size:18px;
    cursor:pointer;
  }

  /* ===== SCROLL: 남는 공간 전부, 스크롤은 여기서만 ===== */
  #app-scroll {
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:20px;
  }

  #app-scroll .block {
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px;
    margin-bottom:14px;
    font-size:14px;
    line-height:1.6;
    color:var(--sub-ink);
  }

  /* ===== TABBAR: 고정, flex-shrink:0, 화면 최하단 ===== */
  #app-tabbar {
    flex-shrink:0;
    display:flex;
    background:var(--card);
    border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
  }

  #app-tabbar button {
    flex:1;
    border:none;
    background:none;
    font-family:inherit;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    padding:13px 4px 4px;
    font-size:11px;
    color:var(--muted);
  }

  #app-tabbar button .ti {
    font-size:22px;
    line-height:1;
  }

  #app-tabbar button.active {
    color:var(--sage);
    font-weight:600;
  }

  /* ===== 화면 전환 (최소 골격) ===== */
  .screen { display:none; }
  .screen.active { display:block; }

  .empty-state {
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
    font-size:14px;
  }

  /* ===== 아카이브 카드 그리드 ===== */
  .archive-grid {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }

  .archive-card {
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px 16px;
    display:flex;
    flex-direction:column;
    gap:8px;
    cursor:pointer;
  }

  .archive-card .ti {
    font-size:24px;
    color:var(--sage);
  }

  .archive-card-title {
    font-size:15px;
    font-weight:600;
    color:var(--ink);
  }

  .archive-card-count {
    font-size:12px;
    color:var(--muted);
    font-family:var(--font-mono);
  }
</style>
</head>
<body>

<div id="app">

  <div id="app-topbar">
    <div id="topbar-main">
      <span class="logo">채움로그</span>
      <span class="date" id="topbar-date"></span>
    </div>
    <div id="topbar-sub">
      <button class="back-btn" onclick="goHome()"><i class="ti ti-chevron-left"></i></button>
      <span id="topbar-sub-title"></span>
    </div>
  </div>

  <div id="app-scroll">

    <div class="screen active" id="screen-home">
      <div class="block">홈 화면 · 오늘의 기록 카드 영역</div>
      <div class="block" onclick="goScreen('archive')" style="cursor:pointer;">
        아카이브 요약 그리드 영역 (탭하면 아카이브 탭으로 이동) →
      </div>
      <div class="block">통계 영역</div>
    </div>

    <div class="screen" id="screen-archive">
      <div class="archive-grid">
        <div class="archive-card" onclick="goScreen('archive-detail','세계사')">
          <i class="ti ti-world"></i>
          <span class="archive-card-title">세계사</span>
          <span class="archive-card-count">12개</span>
        </div>
        <div class="archive-card" onclick="goScreen('archive-detail','음악사')">
          <i class="ti ti-music"></i>
          <span class="archive-card-title">음악사</span>
          <span class="archive-card-count">8개</span>
        </div>
        <div class="archive-card" onclick="goScreen('archive-detail','철학')">
          <i class="ti ti-brain"></i>
          <span class="archive-card-title">철학</span>
          <span class="archive-card-count">5개</span>
        </div>
        <div class="archive-card" onclick="goScreen('archive-detail','경제')">
          <i class="ti ti-chart-line"></i>
          <span class="archive-card-title">경제</span>
          <span class="archive-card-count">3개</span>
        </div>
      </div>
    </div>

    <div class="screen" id="screen-archive-detail">
      <div class="block">여기는 서브줄(뒤로가기)이 있는 화면입니다.</div>
      <div class="block">스크롤 테스트용 블록</div>
      <div class="block">스크롤 테스트용 블록</div>
      <div class="block">스크롤 테스트용 블록</div>
      <div class="block">스크롤 테스트용 블록</div>
      <div class="block">여기까지 스크롤되어도 탭바가 화면 맨 아래 고정되어야 합니다.</div>
    </div>

    <div class="screen" id="screen-search">
      <div class="empty-state">검색 자리</div>
    </div>

    <div class="screen" id="screen-mypage">
      <div class="empty-state">마이페이지 자리</div>
    </div>

  </div>

  <div id="app-tabbar">
    <button class="tab-btn active" data-tab="home" onclick="goScreen('home')">
      <i class="ti ti-home"></i><span>홈</span>
    </button>
    <button class="tab-btn" data-tab="archive" onclick="goScreen('archive')">
      <i class="ti ti-books"></i><span>아카이브</span>
    </button>
    <button class="tab-btn" data-tab="search" onclick="goScreen('search')">
      <i class="ti ti-search"></i><span>검색</span>
    </button>
    <button class="tab-btn" data-tab="mypage" onclick="goScreen('mypage')">
      <i class="ti ti-user"></i><span>마이페이지</span>
    </button>
    <button class="tab-btn" data-tab="iikoto" onclick="goIikoto()">
      <i class="ti ti-flower"></i><span>이이코토</span>
    </button>
  </div>

</div>



<script>
  // 실시간 좌표 확인용 (콘솔에서 확인, 필요시 삭제 가능)
  function logRects() {
    const app = document.getElementById('app');
    const tabbar = document.getElementById('app-tabbar');
    console.log('innerHeight:', window.innerHeight);
    console.log('#app rect:', app.getBoundingClientRect());
    console.log('#app-tabbar rect:', tabbar.getBoundingClientRect());
  }
  window.addEventListener('load', logRects);
  window.addEventListener('resize', logRects);

  // ===== 화면 전환 (최소 골격) =====
  const TAB_SCREENS = ['home', 'archive', 'search', 'mypage']; // 탭바에 직접 대응되는 화면
  const SUB_TITLES = { 'archive-detail': '카테고리 상세' };

  function goScreen(name, subTitle) {
    document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
    document.getElementById('screen-' + name).classList.add('active');
    document.getElementById('app-scroll').scrollTop = 0;

    // 탭바 active 표시: 탭에 직접 속하지 않는 화면(예: archive-detail)은 상위 탭 유지
    const tabName = TAB_SCREENS.includes(name) ? name : name.split('-')[0];
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tab === tabName);
    });

    // topbar 서브줄: 탭바에 없는 화면(상세 화면)이면 뒤로가기 서브줄 노출
    const subBar = document.getElementById('topbar-sub');
    if (!TAB_SCREENS.includes(name)) {
      document.getElementById('topbar-sub-title').textContent = subTitle || SUB_TITLES[name] || '';
      subBar.classList.add('show');
    } else {
      subBar.classList.remove('show');
    }
  }

  function goHome() {
    goScreen('home');
  }

  // 이이코토 앱으로 이동 (외부 링크, 탭 화면 아님)
  function goIikoto() {
    window.location.href = 'https://bombyul1011.github.io/iikoto/';
  }

  // 상단 날짜 표시
  function renderDate() {
    const d = new Date();
    const days = ['일','월','화','수','목','금','토'];
    document.getElementById('topbar-date').textContent =
      `${d.getMonth() + 1}.${d.getDate()} (${days[d.getDay()]})`;
  }
  renderDate();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>채움로그</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#EFF5EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="채움로그">
<link rel="apple-touch-icon" href="./icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Pretendard:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">

<style>
  :root {
    /* ===== 채움로그 디자인 토큰 ===== */
    --bg: #EFF5EC;
    --paper: #F7FAF6;
    --card: #FDFEFC;
    --ink: #2B332E;
    --sage: #8FB89E;
    --lime: #C4D6A4;
    --line: #DDE6DC;
    --muted: #a3b5a8;
    --sub-ink: #6b8074;
    --accent-yellow: #F5C947;
    --accent-brown: #9C6B3E;
    --accent-yellow-bg: #FFF6DC;

    --font-serif: 'Noto Serif KR', serif;
    --font-sans: 'Pretendard', -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { height:100%; overflow:hidden; background:var(--bg); }
  body {
    height:100%; overflow:hidden;
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--ink);
    overscroll-behavior-y: none;
  }
  button { font-family:inherit; }
  a { color:inherit; text-decoration:none; }
  .ti { display:inline-block; vertical-align:-2px; line-height:1; }
  .back { display:inline-flex; align-items:center; gap:2px; }
  .start-link { display:inline-flex; align-items:center; gap:4px; }
  .cta { display:flex; align-items:center; justify-content:center; gap:6px; }

  #app {
    position:relative; z-index:1; max-width:480px; margin:0 auto;
    height:100vh; height:-webkit-fill-available; height:100dvh;
    display:flex; flex-direction:column; background:var(--bg); overflow:hidden;
  }
  #app-topbar { flex-shrink:0; background:var(--bg); padding-top:env(safe-area-inset-top); position:relative; z-index:10; }
  #app-scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; min-height:0; padding-bottom:env(safe-area-inset-bottom); }

  /* 로딩 상태 (스플래시) — iikoto와 동일한 구조: fadeUp 애니메이션, 일정 시간 후 hide */
  #loading {
    position:fixed; inset:0; z-index:999; background:var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    transition:opacity .6s, transform .6s;
  }
  #loading.hide { opacity:0; transform:scale(1.04); pointer-events:none; }
  #loading .splash-logo {
    width:120px; height:120px; object-fit:contain; border-radius:20px;
    opacity:0; transform:translateY(14px);
    animation:splashFadeUp .7s .2s cubic-bezier(.22,.8,.44,1) forwards;
  }
  #loading .splash-sub {
    font-family:var(--font-mono); font-size:11px; color:var(--sage);
    letter-spacing:3px; text-transform:uppercase;
    opacity:0; animation:splashFadeUp .5s .6s ease forwards;
  }
  @keyframes splashFadeUp { to{ opacity:1; transform:translateY(0); } }

  /* ===== 홈 화면 ===== */
  .phone { max-width:420px; margin:0 auto; padding-bottom:88px; }

  /* 하단 플로팅 메뉴 버튼(FAB) + 위로 펼쳐지는 메뉴 */
  #app-tabbar { flex-shrink:0; height:0; z-index:50; }
  #app-tabbar:empty { display:none; }
  .fab-wrap { position:fixed; right:20px; bottom:calc(2px + env(safe-area-inset-bottom)); z-index:60; }
  /* 마우스 기반 환경(PC)이면 창 크기를 줄여도 항상 여유 간격 유지 */
  @media (hover: hover) and (pointer: fine) {
    .fab-wrap { bottom:calc(58px + env(safe-area-inset-bottom)); }
  }
  .fab-btn {
    width:52px; height:52px; border-radius:50%;
    background:var(--sage); color:var(--card);
    display:flex; align-items:center; justify-content:center;
    border:none; box-shadow:0 4px 14px rgba(143,184,158,0.4);
    font-size:22px; cursor:pointer;
    transition:transform 0.25s cubic-bezier(.34,1.56,.64,1), background 0.2s ease;
  }
  .fab-btn.open { transform:rotate(135deg); background:var(--accent-yellow); color:var(--ink); }
  .fab-menu {
    position:absolute; right:0; bottom:64px;
    display:flex; flex-direction:column; align-items:flex-end; gap:10px;
    pointer-events:none;
  }
  .fab-item {
    display:flex; align-items:center; gap:8px;
    opacity:0; transform:translateY(8px) scale(0.9);
    transition:opacity 0.2s ease, transform 0.2s ease;
    pointer-events:none;
  }
  .fab-wrap.open .fab-item { opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
  .fab-wrap.open .fab-item:nth-child(1) { transition-delay:0.02s; }
  .fab-wrap.open .fab-item:nth-child(2) { transition-delay:0.05s; }
  .fab-wrap.open .fab-item:nth-child(3) { transition-delay:0.08s; }
  .fab-wrap.open .fab-item:nth-child(4) { transition-delay:0.11s; }
  .fab-wrap.open .fab-item:nth-child(5) { transition-delay:0.14s; }
  .fab-item-label {
    background:var(--sage); color:var(--card);
    font-family:var(--font-mono); font-size:11px; letter-spacing:0.3px;
    padding:6px 12px; border-radius:20px; white-space:nowrap;
    box-shadow:0 2px 8px rgba(143,184,158,0.35);
  }
  .fab-item-icon {
    width:42px; height:42px; border-radius:50%;
    background:var(--card); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-size:18px; color:var(--muted);
    box-shadow:0 2px 8px rgba(0,0,0,0.12);
  }
  .fab-item.active .fab-item-icon { background:var(--accent-yellow); color:var(--ink); border-color:var(--accent-yellow); }
  .fab-backdrop {
    position:fixed; inset:0; z-index:55;
    background:rgba(43,51,46,0.18);
    opacity:0; pointer-events:none;
    transition:opacity 0.2s ease;
  }
  .fab-backdrop.open { opacity:1; pointer-events:auto; }
  .topbar { display:flex; justify-content:space-between; align-items:center; padding:2px 24px 0; }
  .logo-group { display:flex; align-items:center; gap:6px; cursor:pointer; }
  .logo-mark { width:26px; height:26px; object-fit:contain; display:block; }
  .logo { font-family:var(--font-mono); font-size:12px; letter-spacing:1px; color:var(--sage); }
  .topbar-date { font-family:var(--font-mono); font-size:11px; letter-spacing:0.5px; color:var(--muted); }
  .icon-btn { color:var(--sage); font-size:16px; background:none; border:none; cursor:pointer; }

  .stat-index { display:flex; padding:22px 24px 4px; }
  .stat-nums { flex:0 0 66.6667%; display:grid; grid-template-columns:1fr 1fr 1fr; }
  .stat-nums .item { text-align:left; }
  .stat-nums .n { font-family:var(--font-mono); font-size:34px; font-weight:500; color:var(--ink); line-height:1; }
  .stat-nums .l { font-family:var(--font-mono); font-size:9px; color:var(--sage); letter-spacing:0.5px; margin-top:6px; text-transform:uppercase; height:11px; display:flex; align-items:center; justify-content:flex-start; }
  .stat-recent { flex:1; display:flex; flex-direction:column; justify-content:flex-end; padding-left:16px; border-left:1px dashed var(--line); }
  .stat-recent .spacer { height:34px; }
  .mini-dots { display:flex; justify-content:flex-end; gap:5px; margin-top:6px; height:11px; align-items:center; }
  .mini-dot { width:7px; height:7px; border-radius:50%; background:var(--line); }
  .mini-dot.on { background:var(--accent-yellow); }
  .divider-thin { height:1px; background:var(--line); margin:20px 24px 0; }

  .section-label { padding:22px 24px 12px; font-family:var(--font-mono); font-size:10px; color:var(--sub-ink); letter-spacing:1.5px; text-transform:uppercase; }

  .today-card {
    margin:8px 24px 0; background:var(--paper);
    background-image: repeating-linear-gradient(to bottom, transparent, transparent 35px, #E4ECE0 35px, #E4ECE0 36px);
    border:1px solid var(--line); border-radius:16px; padding:18px; position:relative;
  }
  .today-nav { display:flex; align-items:center; justify-content:center; gap:14px; padding:12px 24px 0; }
  .today-nav-btn {
    width:26px; height:26px; border-radius:50%; border:none; background:none;
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--muted);
  }
  .today-nav-btn:disabled { opacity:0.3; cursor:default; }
  .today-nav-btn .ti { font-size:16px; }
  .today-nav-dots { display:flex; gap:5px; }
  .today-nav-dots span { width:5px; height:5px; border-radius:50%; background:var(--line); }
  .today-nav-dots span.active { background:var(--accent-yellow); width:14px; border-radius:3px; transition:width 0.2s; }
  .today-badge.done { background:var(--sage); color:#fff; }
  .today-badge {
    position:absolute; top:-9px; left:18px; background:var(--accent-yellow); color:var(--ink);
    font-family:var(--font-mono); font-size:9px; font-weight:500; letter-spacing:0.5px;
    padding:4px 10px; border-radius:20px;
    display:inline-flex; align-items:center; gap:4px;
  }
  .today-badge .ti { font-size:13px; }
  .today-meta { display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:10px; color:var(--sage); margin-bottom:10px; padding-top:4px; }
  .today-title { font-family:var(--font-serif); font-size:19px; font-weight:700; line-height:1.9; margin-bottom:12px; word-break:keep-all; }
  .today-tags { display:flex; gap:6px; margin-bottom:16px; }
  .tag { font-family:var(--font-mono); font-size:10px; color:#5b7a63; background:var(--lime); padding:4px 10px; border-radius:20px; }
  .today-foot { display:flex; justify-content:space-between; align-items:center; }
  .read-time { font-family:var(--font-mono); font-size:10px; color:var(--muted); }
  .start-link { font-family:var(--font-sans); font-size:13px; font-weight:600; color:var(--accent-brown); display:flex; align-items:center; gap:4px; cursor:pointer; background:none; border:none; }

  .empty-today {
    margin:0 24px; background:var(--paper);
    background-image: repeating-linear-gradient(to bottom, transparent, transparent 35px, #E4ECE0 35px, #E4ECE0 36px);
    border:1px solid var(--line); border-radius:16px; padding:28px 20px; text-align:center;
  }
  .empty-today .msg { font-family:var(--font-serif); font-size:15px; color:var(--sub-ink); margin-bottom:16px; }

  .archive-cluster { padding:0 24px; margin-bottom:2px; }
  .cluster-row { display:flex; justify-content:space-between; align-items:center; padding:14px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .cluster-left { display:flex; align-items:center; gap:8px; }
  .cluster-cat-icon { font-size:15px; color:var(--muted); line-height:1; display:inline-flex; align-items:center; }
  .cluster-code { font-family:var(--font-mono); font-size:11px; color:var(--sage); width:16px; line-height:1; display:inline-flex; align-items:center; }
  .cluster-name { font-family:var(--font-serif); font-size:15px; font-weight:600; line-height:1; display:inline-flex; align-items:center; }
  .cluster-right { display:flex; align-items:center; gap:10px; }
  .cluster-n { font-family:var(--font-mono); font-size:11px; color:var(--muted); }
  .cluster-arrow { color:var(--accent-yellow); font-size:13px; font-weight:700; }

  .archive-grid { padding:0 24px; display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .grid-card { background:rgba(253,254,252,0.55); border:1px solid var(--line); border-radius:12px; padding:11px; cursor:pointer; }
  .grid-card-icon { font-size:17px; line-height:1; }
  .grid-card-foot { display:flex; justify-content:space-between; align-items:baseline; margin-top:7px; }
  .grid-card-label { display:flex; align-items:baseline; gap:5px; }
  .grid-card-code { font-family:var(--font-mono); font-size:9px; color:var(--muted); }
  .grid-card-name { font-family:var(--font-serif); font-size:14px; font-weight:600; color:var(--ink); }
  .grid-card-n { font-family:var(--font-mono); font-size:16px; font-weight:500; }

  .accum-wrap { padding:28px 24px 8px; text-align:center; }
  .accum-label { font-family:var(--font-mono); font-size:10px; color:var(--sage); letter-spacing:1px; margin-bottom:14px; }
  .dots { display:flex; flex-wrap:wrap; gap:4px; justify-content:center; max-width:280px; margin:0 auto 10px; }
  .dots span { width:5px; height:5px; border-radius:50%; background:var(--lime); display:inline-block; }
  .dots span.d1 { background:var(--sage); }
  .dots span.d2 { background:var(--accent-yellow); }
  .accum-note { font-family:var(--font-serif); font-size:12px; color:var(--sub-ink); font-style:italic; }

  /* ===== 주제 선택 화면 ===== */
  .back { font-family:var(--font-mono); font-size:12px; color:var(--sage); cursor:pointer; background:none; border:none; }
  .pick-lead { padding:8px 24px 24px; }
  .pick-lead h2 { font-family:var(--font-serif); font-size:20px; line-height:1.5; }
  .option-card {
    background:#fff; border:1.5px solid var(--line); border-radius:16px;
    padding:18px; margin:0 24px 14px;
    display:flex; gap:14px; align-items:center; cursor:pointer;
  }
  .option-card.featured { border-color:var(--sage); background:var(--paper); }
  .option-card.disabled { opacity:0.45; cursor:not-allowed; }
  .option-icon { width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; color:var(--accent-yellow); }
  .option-body .o-label { font-family:var(--font-mono); font-size:9px; color:var(--sage); letter-spacing:1px; text-transform:uppercase; margin-bottom:4px; }
  .option-body .o-title { font-family:var(--font-sans); font-size:15px; font-weight:600; margin-bottom:3px; }
  .option-body .o-sub { font-size:12px; color:#8a9a8f; line-height:1.4; }

  .cat-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; padding:4px 24px 24px; }
  .cat-chip { background:#fff; border:1.5px solid var(--line); border-radius:14px; padding:14px; cursor:pointer; text-align:left; }
  .cat-chip .code { font-family:var(--font-mono); font-size:10px; color:var(--sage); }
  .cat-chip .name { font-family:var(--font-serif); font-size:15px; font-weight:600; margin-top:4px; color:var(--ink); }

  .gen-loading { padding:60px 24px; text-align:center; }
  .gen-loading .spin { width:32px; height:32px; border:2px solid var(--line); border-top-color:var(--sage); border-radius:50%; margin:0 auto 18px; animation:spin 0.9s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .gen-loading .msg { font-family:var(--font-mono); font-size:12px; color:var(--sub-ink); }

  /* ===== 세션 화면 ===== */
  .session-wrap { padding:0 24px 88px 24px; }
  .s-meta { font-family:var(--font-mono); font-size:11px; color:var(--sage); margin:18px 0 6px; }
  .s-date { font-family:var(--font-mono); font-size:11px; color:var(--muted); margin-bottom:18px; }
  .title-card { background:var(--paper); border:1px solid var(--line); border-radius:18px; padding:26px 22px; margin-bottom:28px; }
  h1.s-title { font-family:var(--font-serif); font-size:24px; font-weight:700; line-height:1.5; margin-bottom:16px; word-break:keep-all; }
  .s-tags { display:flex; gap:6px; }
  .outline-label { font-family:var(--font-mono); font-size:10px; color:var(--sage); letter-spacing:1px; margin-bottom:14px; text-transform:uppercase; }
  .outline { list-style:none; margin-bottom:8px; }
  .outline li { padding:14px 2px; border-bottom:1.5px dashed var(--lime); display:flex; justify-content:space-between; align-items:center; font-size:15px; line-height:1.6; cursor:pointer; }
  .outline li:first-child { padding-top:0; }
  .outline li .mark { font-size:13px; color:var(--line); flex-shrink:0; margin-left:12px; }
  .outline li.done .mark { color:var(--accent-yellow); }
  .outline li.done .otxt { color:var(--sub-ink); }
  .progress-row { display:flex; justify-content:space-between; align-items:center; margin:22px 0 18px; font-family:var(--font-mono); font-size:11px; color:var(--muted); }
  .pbar { height:2px; background:var(--line); border-radius:2px; flex:1; margin:0 12px; position:relative; overflow:hidden; }
  .pbar .fill { position:absolute; left:0; top:0; bottom:0; background:var(--accent-yellow); transition:width 0.3s; }
  .cta { width:100%; background:var(--sage); color:#fff; border:none; padding:16px; border-radius:14px; font-size:15px; font-weight:600; cursor:pointer; margin-bottom:12px; }
  .pd-body-preview { font-size:14px; line-height:1.8; color:#3d463f; margin-top:14px; padding-top:14px; border-top:1px dashed var(--line); }

  /* ===== 프롬프트 복사 → Claude 연결 토스트 ===== */
  .toast-backdrop { position:fixed; inset:0; background:rgba(43,51,46,0.35); z-index:200; display:flex; align-items:flex-end; justify-content:center; animation:toastFadeIn 0.2s ease; }
  @keyframes toastFadeIn { from{opacity:0;} to{opacity:1;} }
  .toast-sheet { width:100%; max-width:480px; background:var(--card); border-radius:20px 20px 0 0; padding:22px 22px calc(22px + env(safe-area-inset-bottom)); animation:toastSlideUp 0.25s cubic-bezier(.25,.9,.4,1); }
  @keyframes toastSlideUp { from{ transform:translateY(100%); } to{ transform:translateY(0); } }
  .toast-icon { width:44px; height:44px; border-radius:12px; background:var(--accent-yellow-bg); color:var(--accent-yellow); display:flex; align-items:center; justify-content:center; font-size:20px; margin-bottom:14px; }
  .toast-title { font-family:var(--font-serif); font-size:17px; font-weight:600; color:var(--ink); margin-bottom:6px; }
  .toast-sub { font-size:13px; color:var(--sub-ink); line-height:1.6; margin-bottom:20px; }
  .toast-btn-row { display:flex; gap:8px; }
  .toast-btn-row .cta { margin-bottom:0; }
  .toast-btn-secondary { flex:0 0 auto; padding:16px 18px; background:var(--paper); color:var(--sub-ink); border:1px solid var(--line); border-radius:14px; font-size:14px; font-weight:600; cursor:pointer; }

  /* ===== 아카이브 세션 액션 메뉴 (확인/삭제/수정/재학습) ===== */
  .action-menu-list { display:flex; flex-direction:column; gap:2px; }
  .action-menu-item { display:flex; align-items:center; gap:12px; padding:14px 6px; background:none; border:none; text-align:left; cursor:pointer; font-size:14px; color:var(--ink); border-radius:10px; }
  .action-menu-item:active { background:var(--paper); }
  .action-menu-item .ti { font-size:18px; color:var(--sage); width:20px; }
  .action-menu-item.danger { color:#c0504d; }
  .action-menu-item.danger .ti { color:#c0504d; }

  .edit-field-label { font-family:var(--font-mono); font-size:9px; color:var(--sage); letter-spacing:0.5px; text-transform:uppercase; margin:16px 0 6px; }
  .edit-field-label:first-child { margin-top:0; }
  .edit-input, .edit-textarea { width:100%; padding:12px; border:1px solid var(--line); border-radius:10px; font-size:14px; font-family:inherit; color:var(--ink); background:var(--card); }
  .edit-textarea { resize:vertical; min-height:60px; line-height:1.6; }
  .edit-outline-row { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .edit-outline-row .num { font-family:var(--font-mono); font-size:11px; color:var(--muted); width:16px; flex-shrink:0; }

  /* ===== 완료 화면 ===== */
  .complete-wrap { padding:0 24px 88px 24px; }
  .paper-card { margin-top:40px; background:var(--card); border:1px solid var(--ink); border-radius:2px; padding:28px 24px 24px; box-shadow:4px 4px 0 var(--line); }
  .paper-vol-row { display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:11px; color:#5b7a63; padding-bottom:14px; border-bottom:1px solid var(--ink); margin-bottom:20px; letter-spacing:0.5px; }
  .paper-eyebrow { font-family:var(--font-mono); font-size:10px; color:var(--sage); letter-spacing:1.5px; margin-bottom:10px; }
  .paper-title { font-family:var(--font-serif); font-size:24px; font-weight:700; line-height:1.5; margin-bottom:20px; word-break:keep-all; }
  .paper-rule { height:1px; background:var(--line); margin-bottom:16px; }
  .paper-meta-row { display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:10px; color:var(--muted); }
  .paper-tags { display:flex; gap:6px; }
  .complete-below { text-align:center; margin-top:32px; }
  .complete-stamp { display:inline-flex; align-items:center; justify-content:center; width:52px; height:52px; border-radius:50%; border:1.5px solid var(--accent-yellow); background:var(--accent-yellow-bg); color:var(--accent-brown); font-size:20px; margin-bottom:16px; }
  .complete-msg { font-family:var(--font-serif); font-size:15px; color:var(--ink); margin-bottom:6px; }
  .complete-sub { font-family:var(--font-mono); font-size:11px; color:var(--sage); }
  .complete-actions { display:flex; gap:10px; margin-top:32px; padding-bottom:16px; }
  .c-btn { flex:1; padding:14px; border-radius:12px; font-family:var(--font-sans); font-size:13px; font-weight:600; cursor:pointer; text-align:center; border:none; }
  .c-btn.fill { background:var(--ink); color:#EAF2E4; }
  .c-btn.ghost { background:transparent; color:var(--ink); border:1px solid var(--ink); }
  .next-lead { text-align:center; margin:20px 0 8px; }
  .next-lead .done-badge { font-family:var(--font-mono); font-size:10px; color:var(--accent-brown); background:var(--accent-yellow-bg); padding:5px 12px; border-radius:20px; display:inline-block; margin-bottom:12px; }
  .next-lead h3 { font-family:var(--font-serif); font-size:16px; }

  /* ===== 아카이브 상세 ===== */
  .detail-hero { padding:20px 24px 0; }
  .detail-code { font-family:var(--font-mono); font-size:11px; color:var(--sage); letter-spacing:1px; }
  .detail-title { font-family:var(--font-serif); font-size:26px; font-weight:700; margin:8px 0 20px; }
  .detail-stats { display:flex; gap:28px; margin-bottom:8px; }
  .timeline { padding:4px 24px 20px; position:relative; }
  .timeline::before { content:''; position:absolute; left:78px; top:8px; bottom:24px; width:1px; background:var(--line); }
  .t-item { display:grid; grid-template-columns:44px 20px 1fr 32px; align-items:flex-start; padding:16px 0; position:relative; cursor:pointer; }
  .t-date { font-family:var(--font-mono); font-size:10px; color:var(--muted); padding-top:3px; }
  .t-dot-col { display:flex; justify-content:center; padding-top:5px; }
  .t-dot { width:7px; height:7px; border-radius:50%; background:var(--sage); z-index:1; }
  .t-text { font-size:14px; line-height:1.55; padding-right:8px; }
  .t-badge { width:24px; height:24px; border-radius:50%; border:1.5px solid var(--accent-yellow); background:var(--accent-yellow); color:var(--ink); display:flex; align-items:center; justify-content:center; font-size:11px; }
  .empty-archive { padding:60px 24px; text-align:center; font-family:var(--font-mono); font-size:12px; color:var(--muted); }

  /* ===== 뉴스페이퍼 상세 (재열람용) ===== */
  .paper-detail { padding:0 24px 88px 24px; }
  .pd-masthead { text-align:center; padding:18px 0 14px; border-bottom:2px solid var(--ink); margin-bottom:18px; }
  .pd-masthead .name { font-family:var(--font-serif); font-size:15px; font-weight:700; letter-spacing:3px; }
  .pd-masthead .vol { font-family:var(--font-mono); font-size:9px; color:var(--sage); margin-top:4px; letter-spacing:1px; }
  .pd-meta-row { display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:10px; color:var(--muted); margin-bottom:16px; }
  .pd-title { font-family:var(--font-serif); font-size:23px; font-weight:700; line-height:1.5; margin-bottom:14px; word-break:keep-all; }
  .pd-tags { display:flex; gap:6px; margin-bottom:24px; }
  .pd-section { margin-bottom:22px; }
  .pd-num { font-family:var(--font-mono); font-size:10px; color:var(--accent-yellow); background:var(--ink); display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:50%; margin-bottom:8px; }
  .pd-sub { font-family:var(--font-serif); font-size:16px; font-weight:600; margin-bottom:8px; }
  .pd-body { font-size:14px; line-height:1.75; color:#3d463f; }
  .pd-divider { height:1px; background:var(--line); margin:26px 0; }
  .pd-footer-note { background:var(--paper); border:1px dashed var(--lime); border-radius:12px; padding:16px; }
  .pd-footer-label { font-family:var(--font-mono); font-size:9px; color:var(--sage); letter-spacing:1px; margin-bottom:8px; text-transform:uppercase; }
  .pd-footer-text { font-family:var(--font-serif); font-size:13px; font-style:italic; color:var(--sub-ink); line-height:1.6; }
</style>
</head>

const S = {
  get(key) {
    try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; }
  },
  set(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  },
  key(...parts) { return parts.join(':'); }

// ---- 날짜 유틸 (iikoto와 동일 원칙 — 필요 시 새벽 보정 등 추가 예정) ----
function dateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function todayKey() { return dateKey(new Date()); }

// ---- completed_at(ISO 타임스탬프) 포맷 헬퍼 ----
// 날짜만: YYYY-MM-DD (뉴스페이퍼 상세, 아카이브 타임라인 등에서 사용)
function formatCompletedDate(completedAt) {
  if (!completedAt) return '';
  return dateKey(new Date(completedAt));
}
// 날짜 + 24시간 기준 시간: YYYY-MM-DD HH:MM (뉴스페이퍼 상세 전용)
function formatCompletedDateTime(completedAt) {
  if (!completedAt) return '';
  const d = new Date(completedAt);
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  return `${dateKey(d)} ${hh}:${mm}`;
}
function todayDisplay() {
  const d = new Date();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  const dow = ['SUN','MON','TUE','WED','THU','FRI','SAT'][d.getDay()];
  return `${m}.${day} ${dow}`;
}

// ---- Claude API 연동 (iikoto callClaude 패턴 이식) ----
function getClaudeKey() { return S.get('claude_api_key') || ''; }
function setClaudeKey(key) { S.set('claude_api_key', key); }

async function callClaude(systemPrompt, messages, maxTokens) {
  const key = getClaudeKey();
  if (!key) return '__ERR__API 키가 설정되지 않았어요';
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 45000);
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      signal: controller.signal,
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-5',
        max_tokens: maxTokens || 1500,
        system: systemPrompt,
        messages,
        thinking: { type: 'disabled' }
      })
    });
    clearTimeout(timer);
    if (!res.ok) {
      let errText = String(res.status);
      try {
        const err = await res.json();
        errText = (err.error && err.error.message) ? `${res.status}: ${err.error.message}` : String(res.status);
      } catch (parseErr) {
        try { errText = `${res.status}: ${await res.text()}`; } catch (e2) {}
      }
      console.error('Claude API err:', errText);
      return '__ERR__' + errText;
    }
    const data = await res.json();
    // content 배열 안에서 type이 'text'인 블록을 찾음 (thinking 블록이 앞에 올 수 있음)
    const textBlock = Array.isArray(data.content)
      ? data.content.find(b => b && b.type === 'text' && b.text)
      : null;
    const text = textBlock ? textBlock.text : null;
    if (!text) {
      console.error('Claude API — no text block found:', JSON.stringify(data));
      return '__ERR__응답에서 텍스트를 찾지 못했어요 (stop_reason: ' + (data.stop_reason || '?') + ', content types: ' + (Array.isArray(data.content) ? data.content.map(b => b.type).join(',') : 'none') + ')';
    }
    return text;
  } catch (e) {
    console.error('Claude fetch err:', e);
    if (e.name === 'AbortError') return '__ERR__요청 시간 초과 (45초)';
    return '__ERR__네트워크 오류: ' + (e.message || String(e));
  }
}

const MAX_IN_PROGRESS = 3;
async function countInProgressSessions() {
  const { count, error } = await sb
    .from('sessions')
    .select('id', { count: 'exact', head: true })
    .eq('status', 'in_progress');
  if (error) { console.error(error); return 0; }
  return count || 0;
}

// ---- 통계 계산 ----
function calcStreak(archive) {
  // 완료 세션의 DISTINCT date_key 기준 연속 일수 계산
  const dateSet = new Set(archive.map(s => s.date_key));
  const dates = Array.from(dateSet).sort().reverse(); // 최신순
  if (dates.length === 0) return 0;

  let streak = 0;
  let cursor = new Date();
  // 오늘 기록이 없으면 어제부터 체크 (오늘 아직 안 했어도 스트릭 유지)
  if (!dateSet.has(todayKey())) {
    cursor.setDate(cursor.getDate() - 1);
  }
  while (dateSet.has(dateKey(cursor))) {
    streak++;
    cursor.setDate(cursor.getDate() - 1);
  }
  return streak;
}

// 최근 7일(6일 전 ~ 오늘) 완료 여부 배열, 과거 → 오늘 순
function calcRecent7Days(archive) {
  const dateSet = new Set(archive.map(s => s.date_key));
  const result = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    result.push(dateSet.has(dateKey(d)));
  }
  return result;
}

function groupArchiveByCategory(archive, categories) {
  const map = {};
  categories.forEach(c => { map[c.name_ko] = { ...c, sessions: [] }; });
  archive.forEach(s => {
    if (!map[s.category]) map[s.category] = { code: '?', name_ko: s.category, sessions: [] };
    map[s.category].sessions.push(s);
  });
  return Object.values(map)
    .sort((a, b) => b.sessions.length - a.sessions.length || (a.sort_order || 0) - (b.sort_order || 0));
}

// 상단 통계(Branches)는 실제 기록이 있는 갈래 수만 카운트
function countActiveBranches(archive, categories) {
  return groupArchiveByCategory(archive, categories).filter(c => c.sessions.length > 0).length;
}

// ---- 홈 화면 "오늘의 기록" 카드: 화살표로 하나씩 전환 ----
// s가 null이면 "새 주제 뽑기" 카드 (오늘 뽑은 카드들 맨 뒷장에 자연스럽게 위치)
function renderTodayCard(s, isFirstEmpty) {
  if (s === null) {
    const title = isFirstEmpty ? '오늘의 배움을<br>시작해볼까요?' : '오늘 다룰 다른 이야기를<br>골라볼까요?';
    return `
    <div class="today-card">
      <span class="today-badge"><i class="ti ti-plus"></i> 선택</span>
      <div class="today-meta"><span>${todayKey()}</span><span>&nbsp;</span></div>
      <div class="today-title">${title}</div>
      <div class="today-tags"></div>
      <div class="today-foot">
        <span class="read-time">&nbsp;</span>
        <button class="start-link" onclick="navigate('pick')">주제 고르기 <i class="ti ti-arrow-right"></i></button>
      </div>
    </div>`;
  }
  const isDone = s.status === 'completed';
  return `
    <div class="today-card">
      <span class="today-badge${isDone ? ' done' : ''}"><i class="ti ${isDone ? 'ti-check' : 'ti-clover'}"></i> ${isDone ? '완료' : 'TODAY'}</span>
      <div class="today-meta"><span>${todayKey()}</span><span>${escapeHtml(s.category)}</span></div>
      <div class="today-title">${escapeHtml(s.title)}</div>
      <div class="today-tags">${(s.tags || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>
      <div class="today-foot">
        <span class="read-time">${isDone ? '학습 완료' : '학습 진행 중'}</span>
        <button class="start-link" onclick="navigate('${isDone ? 'paper' : 'session'}', {id: '${s.id}'})">${isDone ? '다시 보기' : '이어서 보기'} <i class="ti ti-arrow-right"></i></button>
      </div>
    </div>`;
}

// 오늘의 기록 카드 목록에 "뽑기" 슬롯을 포함할지 여부: 모바일에서만 맨 뒤에 가상 슬롯 추가
function getTodayCardSlots() {
  const list = appState.todaySessions;
  return isMobileDevice() ? [...list, null] : list;
}

function goTodayCard(delta) {
  const slots = getTodayCardSlots();
  if (!slots.length) return;
  appState.todayCardIndex = Math.max(0, Math.min(slots.length - 1, appState.todayCardIndex + delta));
  const wrap = document.getElementById('today-card-wrap');
  const dotsWrap = document.getElementById('today-nav-dots');
  const prevBtn = document.getElementById('today-nav-prev');
  const nextBtn = document.getElementById('today-nav-next');
  if (wrap) wrap.innerHTML = renderTodayCard(slots[appState.todayCardIndex]);
  if (dotsWrap) {
    Array.from(dotsWrap.children).forEach((dot, i) => dot.classList.toggle('active', i === appState.todayCardIndex));
  }
  if (prevBtn) prevBtn.disabled = appState.todayCardIndex === 0;
  if (nextBtn) nextBtn.disabled = appState.todayCardIndex === slots.length - 1;
}

// 오늘의 기록 카드 스와이프 — 손가락 따라 실시간으로 카드가 밀리는 드래그 추적형
let _todaySwipeStartX = null;
let _todaySwipeStartY = null;
let _todaySwipeDragging = false; // 가로 스와이프로 판정된 이후에만 true
let _todaySwipeDirLocked = false; // 방향(가로/세로) 판정 완료 여부

document.addEventListener('touchstart', (e) => {
  const wrap = e.target.closest('#today-card-wrap');
  if (!wrap) return;
  _todaySwipeStartX = e.touches[0].clientX;
  _todaySwipeStartY = e.touches[0].clientY;
  _todaySwipeDragging = false;
  _todaySwipeDirLocked = false;
  wrap.style.transition = 'none';
}, { passive: true });

document.addEventListener('touchmove', (e) => {
  if (_todaySwipeStartX === null) return;
  const wrap = document.getElementById('today-card-wrap');
  if (!wrap) return;
  const dx = e.touches[0].clientX - _todaySwipeStartX;
  const dy = e.touches[0].clientY - _todaySwipeStartY;

  if (!_todaySwipeDirLocked) {
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return; // 판정 전, 아직 대기
    _todaySwipeDirLocked = true;
    _todaySwipeDragging = Math.abs(dx) > Math.abs(dy); // 가로 이동이 더 크면 스와이프로 확정
  }
  if (!_todaySwipeDragging) return; // 세로 스크롤로 판정되면 카드는 건드리지 않음, 브라우저 기본 스크롤 그대로 허용

  // 가로 스와이프로 확정된 순간부터만 기본 동작(페이지 밀림/뒤로가기 제스처)을 막음.
  // 카드 바깥이나 세로 스크롤 중에는 여기 도달하지 않으므로 다른 화면·다른 제스처엔 영향 없음.
  e.preventDefault();

  // 맨 앞/맨 뒤 카드에서 반대 방향으로 당기면 저항감(절반만 이동)을 줌
  const slots = getTodayCardSlots();
  const atStart = appState.todayCardIndex === 0 && dx > 0;
  const atEnd = appState.todayCardIndex === slots.length - 1 && dx < 0;
  const resisted = (atStart || atEnd) ? dx * 0.35 : dx;
  wrap.style.transform = `translateX(${resisted}px)`;
}, { passive: false });

document.addEventListener('touchend', (e) => {
  if (_todaySwipeStartX === null) return;
  const wrap = document.getElementById('today-card-wrap');
  const dx = e.changedTouches[0].clientX - _todaySwipeStartX;
  const wasDragging = _todaySwipeDragging;
  _todaySwipeStartX = null;
  _todaySwipeStartY = null;
  _todaySwipeDragging = false;
  _todaySwipeDirLocked = false;
  if (!wrap) return;

  wrap.style.transition = 'transform 0.25s ease';

  if (!wasDragging || Math.abs(dx) < 40) {
    // 스와이프로 인정 안 됨 → 원위치로 스냅
    wrap.style.transform = 'translateX(0)';
    return;
  }

  const slots = getTodayCardSlots();
  const delta = dx < 0 ? 1 : -1;
  const nextIdx = appState.todayCardIndex + delta;
  if (nextIdx < 0 || nextIdx > slots.length - 1) {
    // 경계에서는 카드 전환 없이 원위치로
    wrap.style.transform = 'translateX(0)';
    return;
  }

  // 진행 방향으로 완전히 밀어낸 뒤, 카드 내용 교체하고 반대편에서 살짝 들어오는 느낌으로 복귀
  const exitX = dx < 0 ? -60 : 60;
  wrap.style.transform = `translateX(${exitX}px)`;
  wrap.style.opacity = '0';
  setTimeout(() => {
    goTodayCard(delta);
    const freshWrap = document.getElementById('today-card-wrap');
    if (freshWrap) {
      freshWrap.style.transition = 'none';
      freshWrap.style.transform = `translateX(${-exitX}px)`;
      freshWrap.style.opacity = '0';
      requestAnimationFrame(() => {
        freshWrap.style.transition = 'transform 0.25s ease, opacity 0.25s ease';
        freshWrap.style.transform = 'translateX(0)';
        freshWrap.style.opacity = '1';
      });
    }
  }, 180);
}, { passive: true });

function renderHome(todaySessions, archive, categories) {
  const streak = calcStreak(archive);
  const totalSessions = archive.length;
  const branches = countActiveBranches(archive, categories);

  const todaySessionsAll = todaySessions; // 진행중 + 완료 모두 포함 (오늘 생성된 전체 세션)
  const todaySlots = isMobileDevice() ? [...todaySessionsAll, null] : todaySessionsAll; // 모바일이면 맨 뒤에 "뽑기" 가상 슬롯 추가
  if (appState.todayCardIndex >= todaySlots.length) appState.todayCardIndex = 0;

  let todayBlock;
  if (todaySessionsAll.length > 0) {
    const idx = appState.todayCardIndex;
    const navHtml = todaySlots.length > 1 ? `
      <div class="today-nav">
        <button class="today-nav-btn" id="today-nav-prev" onclick="goTodayCard(-1)" ${idx === 0 ? 'disabled' : ''}><i class="ti ti-chevron-left"></i></button>
        <div class="today-nav-dots" id="today-nav-dots">
          ${todaySlots.map((_, i) => `<span class="${i === idx ? 'active' : ''}"></span>`).join('')}
        </div>
        <button class="today-nav-btn" id="today-nav-next" onclick="goTodayCard(1)" ${idx === todaySlots.length - 1 ? 'disabled' : ''}><i class="ti ti-chevron-right"></i></button>
      </div>` : '';

    todayBlock = `
      <div id="today-card-wrap">${renderTodayCard(todaySlots[idx])}</div>
      ${navHtml}`;
  } else if (isMobileDevice()) {
    // 세션이 아직 하나도 없는 자정 직후 상태 — "다른 주제 더 뽑기"와 동일한 today-card 스타일 재사용, 문구만 분기
    todayBlock = `<div id="today-card-wrap">${renderTodayCard(null, true)}</div>`;
  } else {
    todayBlock = `
      <div class="empty-today">
        <i class="ti ti-device-mobile" style="font-size:22px; color:var(--muted); display:block; margin-bottom:10px;"></i>
        <div class="msg" style="font-size:13px;">오늘의 주제는 모바일에서 만들 수 있어요</div>

      </div>`;
  }

  const clusters = groupArchiveByCategory(archive, categories);
  const clusterHtml = clusters.length ? clusters.map(c => {
    const color = getCategoryColor(c.name_ko);
    return `
    <div class="grid-card" onclick="navigate('detail', {category: encodeURIComponent('${escapeHtml(c.name_ko)}')})">
      <i class="ti ${getCategoryIcon(c.name_ko)} grid-card-icon" style="color:${color};"></i>
      <div class="grid-card-foot">
        <span class="grid-card-label"><span class="grid-card-code">${escapeHtml(c.code)}</span><span class="grid-card-name">${escapeHtml(c.name_ko)}</span></span>
        <span class="grid-card-n" style="color:${color};">${c.sessions.length}</span>
      </div>
    </div>`;
  }).join('') : `<div style="padding:20px 0; font-family:var(--font-mono); font-size:12px; color:var(--muted);">아직 쌓인 기록이 없어요</div>`;

  const dotsHtml = Array.from({ length: Math.max(totalSessions, 1) }).map((_, i) => {
    const cls = totalSessions === 0 ? '' : (i % 7 === 0 ? 'd2' : (i % 3 === 0 ? 'd1' : ''));
    return `<span class="${cls}"></span>`;
  }).join('');

  const recent7Html = calcRecent7Days(archive).map(done =>
    `<span class="mini-dot${done ? ' on' : ''}"></span>`
  ).join('');

  return `
    <div class="phone">
      <div class="topbar">
        ${renderLogoGroup()}
        <div class="topbar-date">${todayDisplay()}</div>
      </div>

      <div class="stat-index">
        <div class="stat-nums">
          <div class="item"><div class="n" style="color:var(--accent-yellow);">${String(streak).padStart(2,'0')}</div><div class="l">Days</div></div>
          <div class="item"><div class="n">${String(totalSessions).padStart(2,'0')}</div><div class="l">Sessions</div></div>
          <div class="item"><div class="n">${String(branches).padStart(2,'0')}</div><div class="l">Branches</div></div>
        </div>
        <div class="stat-recent">
          <div class="spacer"></div>
          <div class="mini-dots">${recent7Html}</div>
        </div>
      </div>
      <div class="divider-thin"></div>

      <div class="section-label">오늘의 기록</div>
      ${todayBlock}


      <div class="section-label" style="padding-top:16px; padding-bottom:8px;">아카이브</div>
      <div class="archive-grid">${clusterHtml}</div>

      ${totalSessions > 0 ? `
      <div class="accum-wrap" style="padding-top:18px;">
        <div class="accum-label">YOUR KNOWLEDGE, GROWING</div>
        <div class="dots">${dotsHtml}</div>
        <div class="accum-note">지금까지 ${totalSessions}개의 기록이 쌓였어요</div>
      </div>` : ''}
    </div>
    ${renderTabbar('home')}
  `;
}

/* ==========================================================
   라우터 & 앱 상태
   ========================================================== */
const appState = {
  categories: [],
  archive: [],
  todaySessions: [],
  todayCardIndex: 0,        // 홈 화면 "오늘의 기록" 카드 중 현재 보고 있는 인덱스
  currentSessionId: null,   // 세션/완료 화면에서 보고 있는 세션
  pendingSourceType: null,  // 주제 선택 화면에서 고른 방식
  currentArchiveCategory: null // 아카이브 상세에서 보고 있는 카테고리
};

async function refreshData() {
  // 세 요청을 병렬로 실행 — 순차 실행보다 로딩이 눈에 띄게 빨라짐
  const [categories, archive, todaySessions] = await Promise.all([
    fetchCategories(),
    fetchArchive(),
    fetchTodaySession()
  ]);
  appState.categories = categories;
  appState.archive = archive;
  appState.todaySessions = todaySessions;
}

function navigate(route, params) {
  const qs = params ? '?' + new URLSearchParams(params).toString() : '';
  window.location.hash = route + qs;
}

function getRoute() {
  const hash = window.location.hash.replace(/^#/, '');
  const [route, qs] = hash.split('?');
  const params = Object.fromEntries(new URLSearchParams(qs || ''));
  return { route: route || 'home', params };
}

// ---- 탭 간 오른쪽 스와이프 전환 ----
// 왼쪽으로 밀면(오른쪽 스와이프 제스처는 기존 브라우저 "뒤로가기"와 겹치므로),
// 탭 화면(홈/아카이브/검색/마이페이지)에서 "오른쪽으로 밀면" 다음 탭으로 이동한다.
// 오늘의 기록 카드(#today-card-wrap) 위에서의 스와이프와 겹치지 않도록 그 영역은 제외.
const TAB_ORDER = ['home', 'archive', 'search', 'my'];
let _tabSwipeStartX = null;
let _tabSwipeStartY = null;
let _tabSwipeDirLocked = false;
let _tabSwipeIsHorizontal = false;

document.addEventListener('touchstart', (e) => {
  if (e.target.closest('#today-card-wrap')) return; // 카드 스와이프와 충돌 방지
  const scrollEl = e.target.closest('#app-scroll');
  if (!scrollEl) return;
  _tabSwipeStartX = e.touches[0].clientX;
  _tabSwipeStartY = e.touches[0].clientY;
  _tabSwipeDirLocked = false;
  _tabSwipeIsHorizontal = false;
}, { passive: true });

document.addEventListener('touchmove', (e) => {
  if (_tabSwipeStartX === null) return;
  const dx = e.touches[0].clientX - _tabSwipeStartX;
  const dy = e.touches[0].clientY - _tabSwipeStartY;
  if (!_tabSwipeDirLocked) {
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
    _tabSwipeDirLocked = true;
    _tabSwipeIsHorizontal = Math.abs(dx) > Math.abs(dy) * 1.5; // 세로 스크롤 오인 방지, 확실히 가로일 때만
  }
}, { passive: true });

document.addEventListener('touchend', (e) => {
  if (_tabSwipeStartX === null) return;
  const dx = e.changedTouches[0].clientX - _tabSwipeStartX;
  const wasHorizontal = _tabSwipeIsHorizontal;
  _tabSwipeStartX = null;
  _tabSwipeStartY = null;
  _tabSwipeDirLocked = false;
  _tabSwipeIsHorizontal = false;
  if (!wasHorizontal) return;
  if (dx >= -60) return; // 오른쪽에서 왼쪽으로(화면을 오른쪽으로 미는 제스처) 60px 이상 이동해야 인정

  const { route } = getRoute();
  const curIdx = TAB_ORDER.indexOf(route);
  if (curIdx === -1) return; // 탭 화면이 아니면(상세 화면 등) 무시
  const nextIdx = curIdx + 1;
  if (nextIdx > TAB_ORDER.length - 1) return; // 마지막 탭에서는 더 이동하지 않음
  navigate(TAB_ORDER[nextIdx]);
}, { passive: true });


// ---- 라우트 HTML을 고정 topbar(#app-topbar)와 스크롤 영역(#app-scroll)으로 분리해 꽂는 헬퍼 ----
// 각 라우트 함수는 지금처럼 topbar를 포함한 전체 HTML을 그대로 리턴하면 되고,
// 여기서 첫 번째 <div class="topbar"...>...</div>만 정규식으로 뽑아 고정 영역으로 옮긴다.
// topbar가 없는 화면(로딩 스피너 등)은 스크롤 영역에 전체가 들어가고 고정 영역은 비워둔다.
function commonTopbarHtml() {
  return `<div class="topbar">${renderLogoGroup()}<div class="topbar-date">${todayDisplay()}</div></div>`;
}

function mountRoute(html) {
  const topbarEl = document.getElementById('app-topbar');
  const scrollEl = document.getElementById('app-scroll');
  const tabbarEl = document.getElementById('app-tabbar');

  // ---- tabbar 분리: <div class="tabbar" ...>...</div> 블록을 태그 깊이 카운팅으로 찾아 떼어낸다 ----
  function extractTabbar(src) {
    const tIdx = src.indexOf('<div class="tabbar"');
    if (tIdx === -1) return { rest: src, tabbarHtml: '' };
    let depth = 0, end = -1;
    const re = /<div\b[^>]*>|<\/div>/g;
    re.lastIndex = tIdx;
    let mm;
    while ((mm = re.exec(src))) {
      if (mm[0].startsWith('</div>')) {
        depth--;
        if (depth === 0) { end = mm.index + mm[0].length; break; }
      } else {
        depth++;
      }
    }
    if (end === -1) return { rest: src, tabbarHtml: '' };
    return { rest: src.slice(0, tIdx) + src.slice(end), tabbarHtml: src.slice(tIdx, end) };
  }
  const { rest: htmlNoTabbar, tabbarHtml } = extractTabbar(html);
  tabbarEl.innerHTML = tabbarHtml;

  const startIdx = htmlNoTabbar.indexOf('<div class="topbar"');
  if (startIdx === -1) {
    // topbar가 없는 화면(로딩 스피너 등) — 스크롤 영역에 그대로, 고정 영역은 "유지"
    // (예: paper/session/finish처럼 비동기로 나중에 topbar가 채워지는 라우트는
    //  로딩 스피너 단계에서 topbar가 깜빡 사라졌다 다시 생기는 걸 방지)
    scrollEl.innerHTML = htmlNoTabbar;
    return;
  }
  // startIdx부터 시작해 여는/닫는 div 태그 개수를 맞춰 topbar 블록의 끝을 찾는다
  let depth = 0;
  let topbarEnd = -1;
  const tagRe = /<div\b[^>]*>|<\/div>/g;
  tagRe.lastIndex = startIdx;
  let m;
  while ((m = tagRe.exec(htmlNoTabbar))) {
    if (m[0].startsWith('</div>')) {
      depth--;
      if (depth === 0) { topbarEnd = m.index + m[0].length; break; }
    } else {
      depth++;
    }
  }
  if (topbarEnd === -1) {
    // 안전장치: 파싱 실패 시 분리 없이 기존 방식대로 전체를 스크롤 영역에 렌더링
    topbarEl.innerHTML = '';
    scrollEl.innerHTML = htmlNoTabbar;
    return;
  }
  const topbarHtml = htmlNoTabbar.slice(startIdx, topbarEnd);
  const restHtml = htmlNoTabbar.slice(0, startIdx) + htmlNoTabbar.slice(topbarEnd);
  // 공용 고정 topbar(로고+날짜)는 항상 유지하고, 라우트가 제공한 topbar 블록이
  // "뒤로가기(back) 전용" 형태(로고 그룹이 없는 경우)면 고정 영역에 넣지 않고
  // 스크롤 영역 맨 위로 되돌려, 공용 topbar 아래 서브 헤더처럼 보이게 한다.
  const isBackOnlyTopbar = topbarHtml.indexOf('logo-group') === -1 && topbarHtml.indexOf('renderLogoGroup') === -1;
  if (isBackOnlyTopbar) {
    topbarEl.innerHTML = commonTopbarHtml();
    scrollEl.innerHTML = topbarHtml + restHtml;
  } else {
    topbarEl.innerHTML = topbarHtml;
    scrollEl.innerHTML = restHtml;
  }
  scrollEl.scrollTop = 0;
}

async function render() {
  const { route, params } = getRoute();

  if (route === 'home') {
    await refreshData();
    mountRoute(renderHome(appState.todaySessions, appState.archive, appState.categories));
  } else if (route === 'pick') {
    mountRoute(renderPick());
  } else if (route === 'pick-category') {
    mountRoute(renderPickCategory());
  } else if (route === 'generating') {
    mountRoute(renderGenerating());
    await handleGenerate(params);
  } else if (route === 'session') {
    mountRoute(renderSession(params.id));
  } else if (route === 'finish') {
    mountRoute(renderFinish(params.id));
  } else if (route === 'complete') {
    mountRoute(renderComplete(params.id));
  } else if (route === 'paper') {
    mountRoute(renderPaper(params.id));
  } else if (route === 'detail') {
    await refreshData();
    mountRoute(renderDetail(decodeURIComponent(params.category || '')));
  } else if (route === 'archive') {
    await refreshData();
    mountRoute(renderArchiveAll());
  } else if (route === 'search') {
    mountRoute(renderSearch());
  } else if (route === 'my') {
    await refreshData();
    mountRoute(renderMy());
  } else {
    await refreshData();
    mountRoute(renderHome(appState.todaySessions, appState.archive, appState.categories));
  }
}

async function startGenerate(sourceType, category) {
  if (!isMobileDevice()) {
    alert('오늘의 주제 생성은 모바일에서만 가능해요.\n모바일에서 먼저 만들어주시면, 여기서도 바로 확인할 수 있어요.');

  }
  const inProgressCount = await countInProgressSessions();
  if (inProgressCount >= MAX_IN_PROGRESS) {
    alert(`아직 학습을 완료하지 않은 주제가 ${inProgressCount}개 있어요.\n최대 ${MAX_IN_PROGRESS}개까지만 미완료 상태로 쌓아둘 수 있어요.\n기존 것을 완료하거나, 필요 없는 건 삭제한 뒤 다시 뽑아주세요.`);
    return;
  }
  navigate('generating', { source: sourceType, category: category || '' });

function buildGeneratePrompt(sourceType, category, parentSession, avoidTitles) {
  const avoidLine = avoidTitles && avoidTitles.length
    ? `오늘 이미 다룬 주제: ${avoidTitles.join(', ')} — 이것과 겹치지 않는 새로운 소주제로.`
    : '';

  let connectionLine = '';
  if (sourceType === 'tailchain' && parentSession) {
    const userDirection = parentSession.connection_note
      ? `사용자가 다음에 이어보고 싶다고 직접 남긴 방향이 있습니다: "${parentSession.connection_note}"
이 방향을 최우선으로 반영해서 다음 소주제를 만들어주세요. 이 메모가 곧 "그다음"이 무엇이어야 하는지에 대한 가장 확실한 힌트입니다.`
      : '';
    connectionLine = `아래는 사용자가 최근 완료한 학습 세션입니다.
[최근 완료한 세션]
제목: ${parentSession.title}
목차: ${(parentSession.outline || []).map(o => o.text).join(' / ')}

${userDirection}

이 내용에서 자연스럽게 이어질 수 있는 "다음 편" 소주제를 만들어주세요.
- 같은 대주제(${category}) 안에 있되, 방금 다룬 내용의 특정 개념에서 파생되어야 해요
- "그래서 그다음은?" 같은 심화/확장이어야 하고, 완전히 새로운 이야기면 안 돼요
- 제목이나 소재가 방금 세션과 겹치지 않아야 해요`;
  }

  const dataContext = [
    `오늘의 대주제: ${category}`,
    connectionLine,
    avoidLine
  ].filter(Boolean).join('\n\n');

  // 짧은 프롬프트 — 제목/목차/간략요약만 생성 (본문은 여기서 만들지 않음)
  const sys = `당신은 학습 큐레이터예요. 주어진 대주제 안에서 하루 30분 정도 깊이 파볼 만한 구체적인 소주제 하나를 만들어주세요.
소주제는 "기승전결이 있는 하나의 완결된 이야기"여야 해요 — 서로 다른 네 개의 소재를 나열하는 게 아니라, 하나의 질문에서 시작해 네 단계를 거쳐 결론에 도달하는 흐름이어야 합니다.

반드시 아래 JSON 형식으로만 응답해요. 다른 텍스트나 마크다운 코드블록 없이 순수 JSON만 출력해요.
{
  "title": "흥미를 끄는 구체적인 소주제 제목 (한 줄)",
  "shortTitle": "핵심 키워드만 5-10자 내외로 짧게",

  "outline": ["1번 소제목 (3-8단어)", "2번 소제목", "3번 소제목", "4번 소제목"],

제목은 궁금증을 자아내는 질문형이나 구체적인 문장으로. "왜 ~일까?" 패턴만 반복하지 말고, 반전형("사실은 ~였다"), 인물 뒷이야기형, 의외의 연결형 등 다양한 화법을 섞어주세요. 이미 잘 알려진 대표 사례는 피하고, 상대적으로 덜 알려졌지만 흥미로운 각도를 골라주세요. outline 4개는 반드시 하나의 이야기가 순서대로 전개되는 흐름이어야 해요 (예: 배경 → 전환점 → 핵심 원리 → 오늘날의 의미).`;

시작할 때 왜 이 주제가 흥미로운지 짧은 도입부를 넣어주고, 마지막엔 전체 흐름을 한 문단으로 정리해줘. 그 다음 오늘 다룬 내용에서 자연스럽게 뻗어나갈 수 있는 후속 탐구 주제를 2개 제시해줘. 각각 오늘 이야기의 어느 지점에서 파생되는 건지 알 수 있게, 한 줄로 구체적으로 적어줘. 관련해서 최신 정보가 필요하면 검색해서 확인해주고, 더 찾아볼 만한 유튜브 영상(가능하면 한국어 콘텐츠)이나 책, 자료도 추천해줘.`;
}

async function handleGenerate(params) {
  const sourceType = params.source || 'random';
  let category = params.category;
  const categories = appState.categories.length ? appState.categories : await fetchCategories();

  if (!category) {
    category = categories[Math.floor(Math.random() * categories.length)].name_ko;
  }

  let parentSession = null;
  if (sourceType === 'tailchain' && appState.archive[0]) {
    parentSession = appState.archive[0];
    category = parentSession.category;
  }

  const todayTitles = appState.todaySessions.map(s => s.title).filter(Boolean);
  const { sys, dataContext } = buildGeneratePrompt(sourceType, category, parentSession, todayTitles);

  if (!getClaudeKey()) {
    mountRoute(renderApiKeyPrompt());
    return;
  }

  const reply = await callClaude(sys, [{ role: 'user', content: dataContext }], 600);

  if (!reply || reply.startsWith('__ERR__')) {
    const errMsg = reply ? reply.replace('__ERR__', '') : '응답을 받지 못했어요';
    mountRoute(`
      <div class="phone">
        <div class="empty-archive">
          <i class="ti ti-alert-triangle" style="font-size:28px; color:var(--accent-brown); display:block; margin-bottom:12px;"></i>
          생성 중 오류가 발생했어요<br><span style="font-size:11px;">${escapeHtml(errMsg)}</span>
          <div style="margin-top:20px;"><button class="cta" style="width:auto; padding:12px 24px;" onclick="navigate('pick')">다시 시도</button></div>
        </div>
      </div>
      ${renderTabbar('home')}`);
    return;
  }

  let parsed;
  try {
    const clean = reply.replace(/```json|```/g, '').trim();
    parsed = JSON.parse(clean);
  } catch (e) {
    console.error('JSON parse error. Raw reply length:', reply.length, 'Raw reply:', reply);
    mountRoute(`
      <div class="phone"><div class="empty-archive">생성 결과를 해석하지 못했어요 (응답이 잘렸을 수 있어요).
      <div style="margin-top:20px;"><button class="cta" style="width:auto; padding:12px 24px;" onclick="navigate('pick')">다시 시도</button></div>
      </div></div>
      ${renderTabbar('home')}`);
    return;
  }

  const outline = (parsed.outline || []).map(text => ({ text }));
  const connectionNote = (sourceType === 'tailchain' && parsed.connectionNote) ? parsed.connectionNote : null;

  const clientId = 'cid_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);

  const { data, error } = await sb.from('sessions').insert({
    client_id: clientId,
    date_key: todayKey(),
    category: category,
    title: parsed.title,
    short_title: parsed.shortTitle || parsed.title,
    outline: outline,
    brief_summary: parsed.briefSummary || '',
    tags: parsed.tags || [category],
    source_type: sourceType,
    parent_session_id: parentSession ? parentSession.id : null,
    connection_note: connectionNote,
    status: 'in_progress'
  }).select().single();

  if (error) {
    console.error(error);
    mountRoute(`<div style="padding:24px;color:#c0504d;font-family:var(--font-mono);font-size:12px;">저장 중 오류: ${escapeHtml(error.message)}</div>`);
    return;
  }

  // generating(뽑는 중) 단계는 히스토리에 남기지 않는다.
  // hash를 그냥 바꾸면 뒤로가기 시 generating으로 돌아가 새 주제를 또 뽑아버리므로,
  // replaceState로 현재 히스토리 항목을 세션 화면으로 "교체"해 뒤로가기가 pick으로 바로 가게 한다.
  history.replaceState(null, '', '#session?id=' + encodeURIComponent(data.id));
  render();
}

  return `
    <div class="phone">
      <div class="topbar"><button class="back" onclick="navigate('pick')"><i class="ti ti-chevron-left"></i> 뒤로</button></div>
      <div class="pick-lead">

// ---- 비동기로 나중에 채워지는 -outer 패턴(session/finish/complete/paper) 전용:
//      innerHtml에 topbar가 포함돼 있으면 그 부분만 고정 영역(#app-topbar)으로 옮기고,
//      나머지만 outerId 안에 채운다. 로딩 스피너 단계에서 이미 잡아둔 topbar를 덮어쓰지 않도록
//      topbar가 없는 경우(=로딩 스피너 갱신 시점 등)는 고정 영역을 건드리지 않는다.
function mountInner(outerId, innerHtml) {
  const outerEl = document.getElementById(outerId);
  if (!outerEl) return;
  const tabbarEl = document.getElementById('app-tabbar');

  // ---- tabbar 분리 (mountRoute와 동일한 로직) ----
  function extractTabbar(src) {
    const tIdx = src.indexOf('<div class="tabbar"');
    if (tIdx === -1) return { rest: src, tabbarHtml: null };
    let depth = 0, end = -1;
    const re = /<div\b[^>]*>|<\/div>/g;
    re.lastIndex = tIdx;
    let mm;
    while ((mm = re.exec(src))) {
      if (mm[0].startsWith('</div>')) {
        depth--;
        if (depth === 0) { end = mm.index + mm[0].length; break; }
      } else {
        depth++;
      }
    }
    if (end === -1) return { rest: src, tabbarHtml: null };
    return { rest: src.slice(0, tIdx) + src.slice(end), tabbarHtml: src.slice(tIdx, end) };
  }
  const { rest: htmlNoTabbar, tabbarHtml } = extractTabbar(innerHtml);
  // tabbar가 이 innerHtml에 없으면(로딩 스피너 갱신 등) 기존 tabbar를 건드리지 않는다
  if (tabbarHtml !== null && tabbarEl) tabbarEl.innerHTML = tabbarHtml;

  const startIdx = htmlNoTabbar.indexOf('<div class="topbar"');
  if (startIdx === -1) {
    outerEl.innerHTML = htmlNoTabbar;
    return;
  }
  let depth = 0;
  let topbarEnd = -1;
  const tagRe = /<div\b[^>]*>|<\/div>/g;
  tagRe.lastIndex = startIdx;
  let m;
  while ((m = tagRe.exec(htmlNoTabbar))) {
    if (m[0].startsWith('</div>')) {
      depth--;
      if (depth === 0) { topbarEnd = m.index + m[0].length; break; }
    } else {
      depth++;
    }
  }
  if (topbarEnd === -1) {
    outerEl.innerHTML = htmlNoTabbar;
    return;
  }
  const topbarHtml = htmlNoTabbar.slice(startIdx, topbarEnd);
  const restHtml = htmlNoTabbar.slice(0, startIdx) + htmlNoTabbar.slice(topbarEnd);
  const topbarEl = document.getElementById('app-topbar');
  const isBackOnlyTopbar = topbarHtml.indexOf('logo-group') === -1;
  if (isBackOnlyTopbar) {
    if (topbarEl) topbarEl.innerHTML = commonTopbarHtml();
    outerEl.innerHTML = topbarHtml + restHtml;
  } else {
    if (topbarEl) topbarEl.innerHTML = topbarHtml;
    outerEl.innerHTML = restHtml;
  }
}

//      그 새 세션 기준으로 학습 프롬프트를 만들어 복사. 원본은 그대로 두어 타임라인에 남고,
//      원본을 나중에 삭제해도 이 새 세션은 별도 row라 영향받지 않음.
async function relearnSession(sessionId) {
  const original = await fetchSessionById(sessionId);
  if (!original) return;

  const clientId = 'cid_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
  const { data: newSession, error } = await sb.from('sessions').insert({
    client_id: clientId,
    date_key: todayKey(),
    category: original.category,
    title: original.title,
    short_title: original.short_title,
    outline: original.outline,
    brief_summary: original.brief_summary,
    tags: original.tags,
    source_type: 'relearn',
    parent_session_id: original.id,
    connection_note: null,
    status: 'in_progress'
  }).select().single();

  if (error) {
    console.error(error);
    alert('재학습 세션을 만드는 중 오류가 발생했어요: ' + error.message);
    return;
  }

  const prompt = buildLearningPrompt(newSession);
  try {
    await navigator.clipboard.writeText(prompt);
  } catch (e) {
    // 복사 실패해도 세션 자체는 이미 생성됐으니 이동은 진행
  }
  navigate('session', { id: newSession.id });
  // 세션 화면 진입 직후 handoff 토스트를 띄워 Claude 앱으로 자연스럽게 이어지게 함
  setTimeout(() => showClaudeHandoffToast(), 300);
}

async function executeDeleteSession(sessionId, redirectTo) {
  const toast = document.getElementById('delete-confirm-toast');
  if (toast) toast.remove();
  try {
    // 이 세션을 원본으로 재학습된 자식 세션이 있다면, 삭제 전에 부모 연결만 끊어서
    // (DB에 CASCADE 제약이 있더라도) 재학습 기록이 함께 지워지지 않도록 보호
    const { error: unlinkError } = await sb.from('sessions')
      .update({ parent_session_id: null })
      .eq('parent_session_id', sessionId);
    if (unlinkError) console.error('자식 세션 연결 해제 중 오류:', unlinkError);

    const { error } = await sb.from('sessions').delete().eq('id', sessionId);
    if (error) throw error;
    delete _sessionCache[sessionId];
    navigate(redirectTo || 'archive');
  } catch (e) {
    alert('삭제에 실패했어요: ' + (e.message || e));
  }
}

// ---- 수정: 제목/카테고리/태그/목차/요약/느낀점 인라인 편집 ----
async function openEditSession(sessionId) {
  const session = await fetchSessionById(sessionId);
  if (!session) return;
  const outline = session.outline || [];

  const el = document.createElement('div');
  el.id = 'edit-session-modal';
  el.className = 'toast-backdrop';
  el.style.alignItems = 'center';
  el.onclick = (e) => { if (e.target === el) el.remove(); };
  el.innerHTML = `
    <div class="toast-sheet" style="max-height:85vh; overflow-y:auto; border-radius:20px;">
      <div class="toast-title" style="margin-bottom:14px;">기록 수정하기</div>

      <div class="edit-field-label">제목</div>
      <input class="edit-input" id="edit-title" value="${escapeHtml(session.title)}">

      <div class="edit-field-label">태그 (쉼표로 구분)</div>
      <input class="edit-input" id="edit-tags" value="${escapeHtml((session.tags || []).join(', '))}">

      <div class="edit-field-label">목차</div>
      ${outline.map((o, i) => `
        <div class="edit-outline-row">
          <span class="num">${i + 1}</span>
          <input class="edit-input" data-outline-idx="${i}" value="${escapeHtml(o.text)}">
        </div>
      `).join('')}

      <div class="edit-field-label">짧은 요약</div>
      <textarea class="edit-textarea" id="edit-brief">${escapeHtml(session.brief_summary || '')}</textarea>

      <div class="edit-field-label">Comment</div>
      <textarea class="edit-textarea" id="edit-summary-note">${escapeHtml(session.summary_note || '')}</textarea>

      <div class="toast-btn-row" style="margin-top:20px;">
        <button class="toast-btn-secondary" onclick="document.getElementById('edit-session-modal').remove()">취소</button>
        <button class="cta" style="flex:1;" onclick="saveEditSession('${sessionId}')">저장하기</button>
      </div>
    </div>`;
  document.body.appendChild(el);
}

async function saveEditSession(sessionId) {
  const modal = document.getElementById('edit-session-modal');
  if (!modal) return;

  const title = modal.querySelector('#edit-title').value.trim();
  const tagsRaw = modal.querySelector('#edit-tags').value.trim();
  const tags = tagsRaw ? tagsRaw.split(',').map(t => t.trim()).filter(Boolean) : [];
  const briefSummary = modal.querySelector('#edit-brief').value.trim();
  const summaryNote = modal.querySelector('#edit-summary-note').value.trim();
  const outlineInputs = Array.from(modal.querySelectorAll('[data-outline-idx]'));
  const outline = outlineInputs.map(inp => ({ text: inp.value.trim() })).filter(o => o.text);

  if (!title) { alert('제목은 비워둘 수 없어요.'); return; }

  try {
    const { error } = await sb.from('sessions').update({
      title,
      tags,
      brief_summary: briefSummary || null,
      summary_note: summaryNote || null,
      outline,
      updated_at: new Date().toISOString()
    }).eq('id', sessionId);
    if (error) throw error;

    delete _sessionCache[sessionId];
    modal.remove();
    // 현재 보고 있는 화면(paper 상세)을 최신 데이터로 다시 렌더링
    const outer = document.getElementById('paper-outer');
    if (outer) {
      const fresh = await fetchSessionById(sessionId);
      mountInner('paper-outer', renderPaperInner(fresh));
    }
  } catch (e) {
    alert('저장에 실패했어요: ' + (e.message || e));
  }
}

/* ==========================================================
   아카이브 상세
   ========================================================== */
function renderDetail(category) {
  const sessions = appState.archive.filter(s => s.category === category)
    .sort((a, b) => new Date(b.completed_at) - new Date(a.completed_at));
  const cat = appState.categories.find(c => c.name_ko === category);

  if (!sessions.length) {
    return `
      <div class="phone">
        <div class="topbar"><button class="back" onclick="navigate('archive')"><i class="ti ti-chevron-left"></i> 아카이브</button><button class="icon-btn"><i class="ti ti-dots"></i></button></div>
        <div class="empty-archive">아직 "${escapeHtml(category)}" 기록이 없어요</div>
      </div>
      ${renderTabbar('archive')}`;
  }

  const timelineHtml = sessions.map(s => `
    <div class="t-item" onclick="navigate('paper', {id: '${s.id}'})">
      <div class="t-date">${formatCompletedDate(s.completed_at).slice(5).replace('-', '.')}</div>
      <div class="t-dot-col"><div class="t-dot"></div></div>
      <div class="t-text">${escapeHtml(s.title)}</div>
      <div class="t-badge"><i class="ti ti-check"></i></div>
    </div>
  `).join('');

  return `
    <div class="phone">
      <div class="topbar"><button class="back" onclick="navigate('archive')"><i class="ti ti-chevron-left"></i> 아카이브</button></div>
      <div class="detail-hero">
        <div class="detail-code">ARCHIVE / ${escapeHtml(cat ? cat.code : '?')}</div>
        <div class="detail-title">${escapeHtml(category)}</div>
        <div class="detail-stats">
          <div><div class="n" style="font-family:var(--font-mono);font-size:20px;">${sessions.length}</div><div class="l" style="font-family:var(--font-mono);font-size:9px;color:var(--sage);">Sessions</div></div>
        </div>
      </div>
      <div class="divider-thin"></div>
      <div class="timeline">${timelineHtml}</div>
    </div>
    ${renderTabbar('archive')}
  `;
}

/* ==========================================================
   아카이브 전체 (하단탭 · 카테고리 목록)
   ========================================================== */
function renderArchiveAll() {
  const clusters = groupArchiveByCategory(appState.archive, appState.categories).filter(c => c.sessions.length > 0);
  const html = clusters.length ? clusters.map(c => `
    <div class="cluster-row" onclick="navigate('detail', {category: encodeURIComponent('${escapeHtml(c.name_ko)}')})">
      <div class="cluster-left"><i class="ti ${getCategoryIcon(c.name_ko)} cluster-cat-icon"></i><span class="cluster-code">${escapeHtml(c.code)}</span><span class="cluster-name">${escapeHtml(c.name_ko)}</span></div>
      <div class="cluster-right"><span class="cluster-n">${c.sessions.length}</span><span class="cluster-arrow"><i class="ti ti-arrow-right"></i></span></div>
    </div>
  `).join('') : `<div class="empty-archive">아직 쌓인 기록이 없어요</div>`;

  return `
    <div class="phone">
      <div class="topbar">${renderLogoGroup()}<div class="topbar-date">${todayDisplay()}</div></div>
      <div class="section-label">전체 아카이브 · ${clusters.length}개 갈래</div>
      <div class="archive-cluster">${html}</div>
    </div>
    ${renderTabbar('archive')}
  `;
}

/* ==========================================================
   검색 (자리만 — 추후 구현)
   ========================================================== */
function renderSearch() {
  return `
    <div class="phone">
      <div class="topbar">${renderLogoGroup()}<div class="topbar-date">${todayDisplay()}</div></div>
      <div class="empty-archive">
        <i class="ti ti-search" style="font-size:28px; color:var(--line); display:block; margin-bottom:12px;"></i>
        검색 기능은 준비 중이에요
      </div>
    </div>
    ${renderTabbar('search')}
  `;
}

/* ==========================================================
   마이페이지 (자리만 — 추후 구현)
   ========================================================== */
function renderMy() {
  const streak = calcStreak(appState.archive);
  const hasKey = !!getClaudeKey();
  const maskedKey = hasKey ? getClaudeKey().slice(0, 8) + '••••••••' : '';
  return `
    <div class="phone">
      <div class="topbar">${renderLogoGroup()}<div class="topbar-date">${todayDisplay()}</div></div>
      <div class="stat-index" style="gap:28px;">
        <div class="item" style="text-align:left;"><div class="n" style="font-family:var(--font-mono); font-size:22px; font-weight:500; color:var(--accent-yellow); line-height:1;">${String(streak).padStart(2,'0')}</div><div class="l" style="font-family:var(--font-mono); font-size:9px; color:var(--sage); letter-spacing:0.5px; margin-top:4px; text-transform:uppercase;">Days</div></div>
        <div class="item"><div class="n" style="font-family:var(--font-mono); font-size:22px; font-weight:500; color:var(--ink); line-height:1;">${String(appState.archive.length).padStart(2,'0')}</div><div class="l" style="font-family:var(--font-mono); font-size:9px; color:var(--sage); letter-spacing:0.5px; margin-top:4px; text-transform:uppercase;">Sessions</div></div>
      </div>
      <div class="divider-thin"></div>

      <div class="section-label">설정</div>
      <div style="padding:0 24px;">
        <div style="background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px;">
          <div style="font-family:var(--font-mono); font-size:10px; color:var(--sage); letter-spacing:1px; text-transform:uppercase; margin-bottom:8px;">Claude API Key</div>
          ${hasKey
            ? `<div style="font-family:var(--font-mono); font-size:12px; color:var(--sub-ink); margin-bottom:12px;">${maskedKey}</div>`
            : `<div style="font-size:12px; color:var(--muted); margin-bottom:12px;">등록된 키가 없어요</div>`
          }
          <input type="password" id="my-api-key-input" placeholder="sk-ant-..." style="width:100%; padding:12px; border:1px solid var(--line); border-radius:10px; font-family:var(--font-mono); font-size:12px; margin-bottom:10px;">
          <button class="cta" style="margin-bottom:0;" onclick="saveMyApiKey()">${hasKey ? '키 변경하기' : '키 등록하기'}</button>
        </div>
      </div>
    </div>
    ${renderTabbar('my')}
  `;
}

function saveMyApiKey() {
  const input = document.getElementById('my-api-key-input');
  const key = input.value.trim();
  if (!key) return;
  setClaudeKey(key);
  render();
}

// ---- 서비스워커 등록 ----
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

// ---- 앱 부팅 ----
async function boot() {
  const splashStart = Date.now();
  const minSplashMs = 1300; // 로고+문구 페이드업 애니메이션이 끝까지 보일 최소 시간

  try {
    await refreshData();
  } catch (err) {
    console.error('[chaeumlog] boot fetch error:', err);
    document.getElementById('loading').classList.add('hide');
    document.getElementById('app').innerHTML = `
      <div style="padding:24px; font-family:var(--font-mono); font-size:12px; color:#c0504d; white-space:pre-wrap;">
        에러: ${(err.message || err).toString()}
      </div>`;
    return;
  }

  // 새로고침(진입) 시에는 이전 화면의 해시가 남아있어도 항상 홈에서 시작
  window.location.hash = '#home';
  await render();

  const elapsed = Date.now() - splashStart;
  const remaining = Math.max(0, minSplashMs - elapsed);
  setTimeout(() => {
    const el = document.getElementById('loading');
    if (el) el.classList.add('hide');
    // iikoto와 동일하게 DOM에서 완전히 제거하지 않음 — reflow로 배경이 잠깐 씹히는 현상 방지
  }, remaining);
}

boot().catch((err) => {
  console.error('[chaeumlog] boot fatal error:', err);
  const el = document.getElementById('loading');
  if (el) el.innerHTML = '<div class="splash-sub">초기화 오류: ' + (err.message || err) + '</div>';
});
</script>

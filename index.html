<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>채움로그 - 레이아웃 골격 테스트</title>

<style>
  :root {
    --bg: #EFF5EC;
    --paper: #F7FAF6;
    --card: #FDFEFC;
    --ink: #2B332E;
    --sage: #8FB89E;
    --lime: #C4D6A4;
    --line: #DDE6DC;
    --muted: #a3b5a8;
    --sub-ink: #6b8074;
    --font-sans: 'Pretendard', -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  /* html/body는 일반 문서 흐름. 뷰포트 자체를 스크롤 못하게만 막는다. */
  html, body {
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg);
    font-family:var(--font-sans);
    color:var(--ink);
  }

  /* #app: 뷰포트를 꽉 채우는 flex column. 여기 안에서만 topbar/scroll/tabbar를 나눈다. */
  #app {
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    background:var(--bg);
  }

  /* ===== TOPBAR: 고정, flex-shrink:0 ===== */
  #app-topbar {
    flex-shrink:0;
    background:var(--card);
    border-bottom:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 14px) 20px 14px;
    font-family:var(--font-mono);
    font-size:13px;
    letter-spacing:1px;
    color:var(--sage);
  }

  /* ===== SCROLL: 남는 공간 전부, 스크롤은 여기서만 ===== */
  #app-scroll {
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:20px;
  }

  #app-scroll .block {
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px;
    margin-bottom:14px;
    font-size:14px;
    line-height:1.6;
    color:var(--sub-ink);
  }

  /* ===== TABBAR: 고정, flex-shrink:0, 화면 최하단 ===== */
  #app-tabbar {
    flex-shrink:0;
    display:flex;
    background:var(--card);
    border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
  }

  #app-tabbar button {
    flex:1;
    border:none;
    background:none;
    font-family:inherit;
    padding:12px 4px;
    font-size:12px;
    color:var(--muted);
  }

  #app-tabbar button.active {
    color:var(--sage);
    font-weight:600;
  }

  /* 화면 최하단 확인용 마커 - 검증 끝나면 제거 */
  .debug-marker {
    position:fixed;
    left:0; right:0; bottom:0;
    height:2px;
    background:red;
    z-index:999;
    pointer-events:none;
  }
</style>
</head>
<body>

<div id="app">

  <div id="app-topbar">채움로그 · TOPBAR</div>

  <div id="app-scroll">
    <div class="block">스크롤 영역 테스트 블록 1</div>
    <div class="block">스크롤 영역 테스트 블록 2</div>
    <div class="block">스크롤 영역 테스트 블록 3</div>
    <div class="block">스크롤 영역 테스트 블록 4</div>
    <div class="block">스크롤 영역 테스트 블록 5</div>
    <div class="block">스크롤 영역 테스트 블록 6</div>
    <div class="block">스크롤 영역 테스트 블록 7</div>
    <div class="block">스크롤 영역 테스트 블록 8</div>
    <div class="block">스크롤 영역 테스트 블록 9</div>
    <div class="block">스크롤 영역 테스트 블록 10</div>
    <div class="block">여기까지 스크롤되면, 아래 탭바가 항상 화면 맨 아래 고정되어 있어야 합니다.</div>
  </div>

  <div id="app-tabbar">
    <button class="active">홈</button>
    <button>아카이브</button>
    <button>검색</button>
    <button>마이페이지</button>
  </div>

</div>

<!-- 빨간 선이 항상 화면 맨 아래 붙어있어야 정상. 탭바 아래 여백 있으면 이 선과 탭바 사이에 틈이 보임 -->
<div class="debug-marker"></div>

<script>
  // 실시간 좌표 확인용 (콘솔에서 확인)
  function logRects() {
    const app = document.getElementById('app');
    const tabbar = document.getElementById('app-tabbar');
    console.log('innerHeight:', window.innerHeight);
    console.log('#app rect:', app.getBoundingClientRect());
    console.log('#app-tabbar rect:', tabbar.getBoundingClientRect());
  }
  window.addEventListener('load', logRects);
  window.addEventListener('resize', logRects);
</script>

</body>
</html>

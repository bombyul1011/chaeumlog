<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>채움로그 - 레이아웃 골격 테스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Pretendard:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">

<style>
  :root {
    --bg: #EFF5EC;
    --paper: #F7FAF6;
    --card: #FDFEFC;
    --ink: #2B332E;
    --sage: #8FB89E;
    --lime: #C4D6A4;
    --line: #DDE6DC;
    --muted: #a3b5a8;
    --sub-ink: #6b8074;
    --accent-yellow: #F5C947;
    --accent-brown: #9C6B3E;
    --accent-yellow-bg: #FFF6DC;
    --font-serif: 'Noto Serif KR', serif;
    --font-sans: 'Pretendard', -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  /* html/body는 일반 문서 흐름. 뷰포트 자체를 스크롤 못하게만 막는다. */
  html, body {
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg);
    font-family:var(--font-sans);
    color:var(--ink);
  }

  /* #app: position:fixed로 뷰포트 4방향에 직접 고정. body는 fixed 아님(이중 fixed 방지) */
  #app {
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    background:var(--bg);
  }

  /* ===== TOPBAR: 고정, flex-shrink:0 ===== */
  #app-topbar {
    flex-shrink:0;
    background:var(--bg);
  }

  #topbar-main {
    padding:calc(env(safe-area-inset-top) + 14px) 24px 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }

  #topbar-main .brand {
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
    background:none;
    border:none;
    padding:0;
  }

  #topbar-main .brand img {
    width:26px;
    height:26px;
    object-fit:contain;
  }

  #topbar-main .brand .app-name {
    font-family:var(--font-mono);
    font-size:12px;
    letter-spacing:1px;
    color:var(--sage);
    font-weight:400;
  }

  #topbar-main .date {
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.5px;
    color:var(--muted);
  }

  /* 서브줄: 화면별 뒤로가기 등. 내용 없으면 자동으로 숨김(공간 차지 X) */
  #topbar-sub {
    display:none;
    align-items:center;
    gap:6px;
    padding:0 24px 12px;
    font-size:14px;
    color:var(--ink);
    font-weight:600;
  }

  #topbar-sub.show { display:flex; }

  #topbar-sub .back-btn {
    display:flex;
    align-items:center;
    justify-content:center;
    width:28px; height:28px;
    margin-left:-6px;
    border:none;
    background:none;
    color:var(--sub-ink);
    font-size:18px;
    cursor:pointer;
  }

  /* ===== SCROLL: 남는 공간 전부, 스크롤은 여기서만 ===== */
  #app-scroll {
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:20px 24px;
  }

  #app-scroll .block {
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px;
    margin-bottom:14px;
    font-size:14px;
    line-height:1.6;
    color:var(--sub-ink);
  }

  /* ===== TABBAR: 고정, flex-shrink:0, 화면 최하단 ===== */
  #app-tabbar {
    flex-shrink:0;
    display:flex;
    background:var(--card);
    border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
  }

  #app-tabbar button {
    flex:1;
    border:none;
    background:none;
    font-family:inherit;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    padding:13px 4px 4px;
    font-size:11px;
    color:var(--muted);
  }

  #app-tabbar button .ti {
    font-size:22px;
    line-height:1;
  }

  #app-tabbar button.active {
    color:var(--sage);
    font-weight:600;
  }

  /* ===== 화면 전환 (최소 골격) ===== */
  .screen { display:none; }
  .screen.active { display:block; }

  .empty-state {
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
    font-size:14px;
  }

  /* ===== 홈 상단 통계 카운터 + 연속 스트릭 ===== */
  .stats-row {
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding-bottom:16px;
    margin-bottom:16px;
    border-bottom:1px solid var(--line);
  }

  .stat-index {
    display:flex;
  }

  .stat-nums {
    flex:0 0 66.6667%;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
  }

  .stat-nums .item { text-align:left; }

  .stat-nums .n {
    font-family:var(--font-mono);
    font-size:34px;
    font-weight:500;
    color:var(--ink);
    line-height:1;
  }

  .stat-nums .l {
    font-family:var(--font-mono);
    font-size:9px;
    color:var(--sage);
    letter-spacing:0.5px;
    margin-top:6px;
    text-transform:uppercase;
    height:11px;
    display:flex;
    align-items:center;
    justify-content:flex-start;
  }

  .stat-recent {
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    padding-left:16px;
    border-left:1px dashed var(--line);
  }

  .stat-recent .spacer { height:34px; }

  .mini-dots {
    display:flex;
    justify-content:flex-end;
    gap:5px;
    margin-top:6px;
    height:11px;
    align-items:center;
  }

  .mini-dot {
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--line);
  }

  .mini-dot.on { background:var(--accent-yellow); }

  .divider-thin {
    height:1px;
    background:var(--line);
    margin:20px 0 0;
  }

  /* ===== 섹션 라벨 ===== */
  .section-label {
    padding:22px 0 12px;
    font-family:var(--font-mono);
    font-size:10px;
    color:var(--sub-ink);
    letter-spacing:1.5px;
    text-transform:uppercase;
  }

  /* ===== 오늘의 기록 카드 (좌우 화살표 네비게이션) ===== */
  .today-card {
    background:var(--paper);
    background-image:repeating-linear-gradient(to bottom, transparent, transparent 35px, #E4ECE0 35px, #E4ECE0 36px);
    border:1px solid var(--line);
    border-radius:16px;
    padding:18px;
    position:relative;
    display:flex;
    flex-direction:column;
    justify-content:center;
    min-height:236px;
    box-sizing:border-box;
  }

  .today-badge {
    position:absolute;
    top:-9px;
    left:18px;
    background:var(--accent-yellow);
    color:var(--ink);
    font-family:var(--font-mono);
    font-size:9px;
    font-weight:500;
    letter-spacing:0.5px;
    padding:4px 10px;
    border-radius:20px;
    display:inline-flex;
    align-items:center;
    gap:4px;
  }

  .today-badge.done { background:var(--sage); color:#fff; }
  .today-badge .ti { font-size:13px; }

  .today-meta {
    display:flex;
    justify-content:space-between;
    font-family:var(--font-mono);
    font-size:10px;
    color:var(--sage);
    margin-bottom:10px;
    padding-top:4px;
  }

  .today-title {
    font-family:var(--font-serif);
    font-size:19px;
    font-weight:700;
    line-height:1.9;
    margin-bottom:12px;
    word-break:keep-all;
    display:flex;
    align-items:center;
    min-height:72px;
  }

  .today-tags {
    display:flex;
    gap:6px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }

  .today-tags .tag {
    font-family:var(--font-mono);
    font-size:10px;
    color:#5b7a63;
    background:var(--lime);
    padding:4px 10px;
    border-radius:20px;
  }

  .today-foot {
    display:flex;
    justify-content:space-between;
    align-items:center;
  }

  .read-time {
    font-family:var(--font-mono);
    font-size:10px;
    color:var(--muted);
  }

  .start-link {
    font-family:var(--font-sans);
    font-size:13px;
    font-weight:600;
    color:var(--accent-brown);
    display:flex;
    align-items:center;
    gap:4px;
    cursor:pointer;
    background:none;
    border:none;
  }

  /* 오늘의 기록 카드 좌우 네비게이션 */
  .today-nav {
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:12px 0 0;
  }

  .today-nav-btn {
    width:26px;
    height:26px;
    border-radius:50%;
    border:none;
    background:none;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:var(--muted);
  }

  .today-nav-btn:disabled { opacity:0.3; cursor:default; }
  .today-nav-btn .ti { font-size:16px; }

  .today-nav-dots {
    display:flex;
    gap:5px;
  }

  .today-nav-dots span {
    width:5px;
    height:5px;
    border-radius:50%;
    background:var(--line);
  }

  .today-nav-dots span.active {
    background:var(--accent-yellow);
    width:14px;
    border-radius:3px;
    transition:width 0.2s;
  }

  /* ===== 아카이브 카드 그리드 ===== */
  .archive-grid {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }

  .archive-card {
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px 16px;
    display:flex;
    flex-direction:column;
    gap:8px;
    cursor:pointer;
  }

  .archive-card .ti {
    font-size:24px;
    color:var(--sage);
  }

  .archive-card-title {
    font-size:15px;
    font-weight:600;
    color:var(--ink);
  }

  .archive-card-count {
    font-size:12px;
    color:var(--muted);
    font-family:var(--font-mono);
  }
</style>
</head>

<script>
  // 실시간 좌표 확인용 (콘솔에서 확인, 필요시 삭제 가능)
  function logRects() {
    const app = document.getElementById('app');
    const tabbar = document.getElementById('app-tabbar');
    console.log('innerHeight:', window.innerHeight);
    console.log('#app rect:', app.getBoundingClientRect());
    console.log('#app-tabbar rect:', tabbar.getBoundingClientRect());
  }
  window.addEventListener('load', logRects);
  window.addEventListener('resize', logRects);

  // ===== 화면 전환 (최소 골격) =====
  const TAB_SCREENS = ['home', 'archive', 'search', 'mypage']; // 탭바에 직접 대응되는 화면
  const SUB_TITLES = { 'archive-detail': '카테고리 상세' };

  function goScreen(name, subTitle) {
    document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
    document.getElementById('screen-' + name).classList.add('active');
    document.getElementById('app-scroll').scrollTop = 0;

    // 탭바 active 표시: 탭에 직접 속하지 않는 화면(예: archive-detail)은 상위 탭 유지
    const tabName = TAB_SCREENS.includes(name) ? name : name.split('-')[0];
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tab === tabName);
    });

    // topbar 서브줄: 탭바에 없는 화면(상세 화면)이면 뒤로가기 서브줄 노출
    const subBar = document.getElementById('topbar-sub');
    if (!TAB_SCREENS.includes(name)) {
      document.getElementById('topbar-sub-title').textContent = subTitle || SUB_TITLES[name] || '';
      subBar.classList.add('show');
    } else {
      subBar.classList.remove('show');
    }
  }

  function goHome() {
    goScreen('home');
  }

  // 이이코토 앱으로 이동 (외부 링크, 탭 화면 아님)
  function goIikoto() {
    window.location.href = 'https://bombyul1011.github.io/iikoto/';
  }

  // 상단 날짜 표시 (예: 08.19 WED)
  function renderDate() {
    const d = new Date();
    const days = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    document.getElementById('topbar-date').textContent = `${mm}.${dd} ${days[d.getDay()]}`;
  }
  renderDate();

  // ===== 오늘의 기록 카드 (좌우 화살표 네비게이션) =====
  const todayKey = '2026-08-19';

  const todaySlots = [
    {
      id: 1, status: 'active', category: '시사',
      title: '왜 어떤 나라는 화폐를 스스로 포기했을까 - 달러화의 정치경제학',
      tags: ['국제경제', '통화정책', '시사']
    },
    {
      id: 2, status: 'completed', category: '예술',
      title: '인상주의는 왜 처음엔 조롱받았을까',
      tags: ['미술사', '인상주의']
    },
    null // 새 주제 뽑기 슬롯
  ];

  let todayCardIndex = 0;

  function renderTodayCard(s) {
    if (s === null) {
      return `
      <div class="today-card">
        <span class="today-badge"><i class="ti ti-plus"></i> 선택</span>
        <div class="today-meta"><span>${todayKey}</span><span>&nbsp;</span></div>
        <div class="today-title">오늘 다룰 다른 이야기를<br>골라볼까요?</div>
        <div class="today-tags"></div>
        <div class="today-foot">
          <span class="read-time">&nbsp;</span>
          <button class="start-link" onclick="goScreen('pick')">주제 고르기 <i class="ti ti-arrow-right"></i></button>
        </div>
      </div>`;
    }
    const isDone = s.status === 'completed';
    return `
      <div class="today-card">
        <span class="today-badge${isDone ? ' done' : ''}"><i class="ti ${isDone ? 'ti-check' : 'ti-clover'}"></i> ${isDone ? '완료' : 'TODAY'}</span>
        <div class="today-meta"><span>${todayKey}</span><span>${s.category}</span></div>
        <div class="today-title">${s.title}</div>
        <div class="today-tags">${s.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
        <div class="today-foot">
          <span class="read-time">${isDone ? '학습 완료' : '학습 진행 중'}</span>
          <button class="start-link" onclick="goScreen('${isDone ? 'archive-detail' : 'pick'}')">${isDone ? '다시 보기' : '이어서 보기'} <i class="ti ti-arrow-right"></i></button>
        </div>
      </div>`;
  }

  function renderTodayNav() {
    const dotsWrap = document.getElementById('today-nav-dots');
    const prevBtn = document.getElementById('today-nav-prev');
    const nextBtn = document.getElementById('today-nav-next');
    if (!dotsWrap) return;

    dotsWrap.innerHTML = todaySlots.map((_, i) =>
      `<span class="${i === todayCardIndex ? 'active' : ''}"></span>`
    ).join('');

    prevBtn.disabled = todayCardIndex === 0;
    nextBtn.disabled = todayCardIndex === todaySlots.length - 1;
  }

  function renderTodayCardWrap() {
    document.getElementById('today-card-wrap').innerHTML = renderTodayCard(todaySlots[todayCardIndex]);
    renderTodayNav();
  }

  function goTodayCard(dir) {
    const next = todayCardIndex + dir;
    if (next < 0 || next >= todaySlots.length) return;
    todayCardIndex = next;
    renderTodayCardWrap();
  }

  renderTodayCardWrap();

  // ===== 오늘의 기록 카드 스와이프 제스처 =====
  (function setupTodaySwipeGesture() {
    const wrap = document.getElementById('today-card-wrap');
    let startX = 0, startY = 0, tracking = false;

    wrap.addEventListener('touchstart', (e) => {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      tracking = true;
    }, { passive: true });

    wrap.addEventListener('touchend', (e) => {
      if (!tracking) return;
      tracking = false;
      const dx = e.changedTouches[0].clientX - startX;
      const dy = e.changedTouches[0].clientY - startY;
      // 세로 스크롤과 헷갈리지 않도록: 가로 이동이 세로보다 뚜렷하고, 최소 40px 이상일 때만 전환
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
        goTodayCard(dx < 0 ? 1 : -1);
      }
    }, { passive: true });
  })();
</script>

</body>
</html>

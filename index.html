<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>chaeumlog - 골격 재검증</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Pretendard:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    width:100%;
    height:100%;
    overflow:hidden;
    background:#EFF5EC;
    font-family:-apple-system, sans-serif;
    color:#2B332E;
  }

  #app {
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    background:#EFF5EC;
  }

  #app-topbar {
    flex-shrink:0;
    background:#FDFEFC;
    border-bottom:1px solid #DDE6DC;
  }

  #topbar-main {
    padding:env(safe-area-inset-top) 24px 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }

  #topbar-main .brand {
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
    background:none;
    border:none;
    padding:0;
  }

  #topbar-main .brand .app-name {
    font-size:12px;
    letter-spacing:1px;
    color:#8FB89E;
    font-weight:400;
  }

  #topbar-main .date {
    font-size:11px;
    letter-spacing:0.5px;
    color:#a3b5a8;
  }

  #topbar-sub {
    display:none;
    align-items:center;
    justify-content:space-between;
    gap:6px;
    padding:0 24px 12px;
    font-size:14px;
    color:#2B332E;
    font-weight:600;
  }

  #topbar-sub.show { display:flex; }

  #app-scroll {
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:20px;
  }

  #app-scroll .block {
    background:#FDFEFC;
    border:1px solid #DDE6DC;
    border-radius:14px;
    padding:20px;
    margin-bottom:14px;
    font-size:14px;
    line-height:1.6;
    color:#6b8074;
  }

  .screen { display:none; }
  .screen.active { display:block; }

  #app-tabbar {
    flex-shrink:0;
    display:flex;
    background:#FDFEFC;
    border-top:1px solid #DDE6DC;
    padding-bottom:env(safe-area-inset-bottom);
  }

  #app-tabbar button {
    flex:1;
    border:none;
    background:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    padding:10px 4px 4px;
    font-size:11px;
    color:#a3b5a8;
  }

  #app-tabbar button .ti {
    font-size:22px;
  }

  #app-tabbar button.active {
    color:#8FB89E;
    font-weight:600;
  }

  .debug-marker {
    position:fixed;
    left:0; right:0; bottom:0;
    height:2px;
    background:red;
    z-index:999;
    pointer-events:none;
  }
</style>
</head>
<body>

<div id="app">

  <div id="app-topbar">
    <div id="topbar-main">
      <button class="brand">
        <span class="app-name">chaeumlog</span>
      </button>
      <span class="date" id="topbar-date"></span>
    </div>
    <div id="topbar-sub">
      <span>서브줄</span>
    </div>
  </div>

  <div id="app-scroll">
    <div class="screen active" id="screen-home">
      <div id="today-card-wrap" style="background:#FDFEFC; border:1px solid #DDE6DC; border-radius:14px; padding:20px; margin-bottom:14px;">
        <div style="font-weight:600; margin-bottom:8px;">오늘의 기록 카드 (스와이프 테스트용)</div>
        <div style="font-size:13px; color:#6b8074;">좌우로 스와이프해보세요</div>
      </div>
      <div class="block">테스트 블록 1</div>
      <div class="block">테스트 블록 2</div>
      <div class="block">테스트 블록 3</div>
      <div class="block">테스트 블록 4</div>
      <div class="block">테스트 블록 5</div>
      <div class="block">테스트 블록 6</div>
      <div class="block">테스트 블록 7</div>
      <div class="block">테스트 블록 8</div>
      <div class="block">테스트 블록 9</div>
      <div class="block">테스트 블록 10</div>
      <div class="block">여기까지 스크롤되면, 아래 탭바가 항상 화면 맨 아래 고정되어 있어야 합니다.</div>
    </div>
    <div class="screen" id="screen-archive">
      <div class="block">아카이브 블록 1</div>
      <div class="block">아카이브 블록 2</div>
      <div class="block">아카이브 블록 3</div>
    </div>
    <div class="screen" id="screen-archive-detail"><div class="block">상세 (숨김)</div></div>
    <div class="screen" id="screen-search">
      <div class="block">검색 블록 1</div>
      <div class="block">검색 블록 2</div>
    </div>
    <div class="screen" id="screen-mypage">
      <div class="block">마이페이지 블록 1</div>
      <div class="block">마이페이지 블록 2</div>
    </div>
    <div class="screen" id="screen-pick"><div class="block">pick (숨김)</div></div>
    <div class="screen" id="screen-finish"><div class="block">finish (숨김)</div></div>
    <div class="screen" id="screen-paper"><div class="block">paper (숨김)</div></div>
  </div>

  <div id="app-tabbar">
    <button class="tab-btn active" data-tab="home" onclick="goScreen('home')"><i class="ti ti-home"></i><span>홈</span></button>
    <button class="tab-btn" data-tab="archive" onclick="goScreen('archive')"><i class="ti ti-books"></i><span>아카이브</span></button>
    <button class="tab-btn" data-tab="search" onclick="goScreen('search')"><i class="ti ti-search"></i><span>검색</span></button>
    <button class="tab-btn" data-tab="mypage" onclick="goScreen('mypage')"><i class="ti ti-user"></i><span>마이페이지</span></button>
  </div>

</div>

<div class="debug-marker"></div>

<script>
  const d = new Date();
  document.getElementById('topbar-date').textContent = `${d.getMonth()+1}.${d.getDate()}`;

  // ===== 실제 boot() 흐름 재현: Supabase 클라이언트 생성 + 비동기 fetch 후 DOM 재작성 =====
  const SUPABASE_URL = 'https://sqeyoqpchiljvinuqxjf.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxZXlvcXBjaGlsanZpbnVxeGpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5ODY5NTksImV4cCI6MjEwMjU2Mjk1OX0.H_JNNYz7_eguAqds-Wm6cwK926U74aVPaS_XwGRKeB0';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function boot() {
    try {
      const { data, error } = await sb.from('sessions').select('id').limit(1);
      console.log('fetch result:', data, error);
    } catch (err) {
      console.error('fetch error:', err);
    }

    // 실제 데이터로 홈 화면 콘텐츠를 다시 그리는 것을 흉내
    const scrollEl = document.getElementById('screen-home');
    const extra = document.createElement('div');
    extra.className = 'block';
    extra.textContent = '서버에서 받아온 것처럼 나중에 추가된 블록';
    scrollEl.appendChild(extra);
  }

  boot();

  // ===== 화면 전환 =====
  const TAB_ORDER = ['home', 'archive', 'search', 'mypage'];
  let currentScreen = 'home';

  function goScreen(name) {
    document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
    document.getElementById('screen-' + name).classList.add('active');
    document.getElementById('app-scroll').scrollTop = 0;
    currentScreen = name;
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tab === name);
    });
  }

  // ===== 실제 파일의 document 레벨 touch 리스너 재현 (오늘의 기록 카드 스와이프) =====
  let _todaySwipeStartX = null;
  let _todaySwipeStartY = null;
  let _todaySwipeDragging = false;
  let _todaySwipeDirLocked = false;

  document.addEventListener('touchstart', (e) => {
    const wrap = e.target.closest('#today-card-wrap');
    if (!wrap) return;
    _todaySwipeStartX = e.touches[0].clientX;
    _todaySwipeStartY = e.touches[0].clientY;
    _todaySwipeDragging = false;
    _todaySwipeDirLocked = false;
  }, { passive: true });

  document.addEventListener('touchmove', (e) => {
    if (_todaySwipeStartX === null) return;
    const dx = e.touches[0].clientX - _todaySwipeStartX;
    const dy = e.touches[0].clientY - _todaySwipeStartY;
    if (!_todaySwipeDirLocked) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      _todaySwipeDirLocked = true;
      _todaySwipeDragging = Math.abs(dx) > Math.abs(dy);
    }
    if (!_todaySwipeDragging) return;
    e.preventDefault();
  }, { passive: false });

  document.addEventListener('touchend', () => {
    _todaySwipeStartX = null;
    _todaySwipeStartY = null;
    _todaySwipeDragging = false;
    _todaySwipeDirLocked = false;
  }, { passive: true });

  // ===== 탭 스와이프 리스너도 재현 =====
  let _tabSwipeStartX = null;
  let _tabSwipeStartY = null;
  let _tabSwipeDirLocked = false;
  let _tabSwipeIsHorizontal = false;

  document.addEventListener('touchstart', (e) => {
    const scrollEl = e.target.closest('#app-scroll');
    if (!scrollEl) return;
    _tabSwipeStartX = e.touches[0].clientX;
    _tabSwipeStartY = e.touches[0].clientY;
    _tabSwipeDirLocked = false;
    _tabSwipeIsHorizontal = false;
  }, { passive: true });

  document.addEventListener('touchmove', (e) => {
    if (_tabSwipeStartX === null) return;
    const dx = e.touches[0].clientX - _tabSwipeStartX;
    const dy = e.touches[0].clientY - _tabSwipeStartY;
    if (!_tabSwipeDirLocked) {
      if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
      _tabSwipeDirLocked = true;
      _tabSwipeIsHorizontal = Math.abs(dx) > Math.abs(dy) * 1.5;
    }
  }, { passive: true });

  document.addEventListener('touchend', (e) => {
    if (_tabSwipeStartX === null) return;
    const dx = e.changedTouches[0].clientX - _tabSwipeStartX;
    const wasHorizontal = _tabSwipeIsHorizontal;
    _tabSwipeStartX = null;
    _tabSwipeStartY = null;
    _tabSwipeDirLocked = false;
    _tabSwipeIsHorizontal = false;
    if (!wasHorizontal) return;
    if (dx >= -60) return; // 왼쪽으로 60px 이상 이동해야 인정

    const curIdx = TAB_ORDER.indexOf(currentScreen);
    if (curIdx === -1) return;
    const nextIdx = curIdx + 1;
    if (nextIdx > TAB_ORDER.length - 1) return;
    goScreen(TAB_ORDER[nextIdx]);
  }, { passive: true });
</script>

</body>
</html>
